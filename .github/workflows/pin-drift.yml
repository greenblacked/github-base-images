# Daily check that the hand-pinned tool versions have not fallen behind
# upstream, reported as a single tracking issue that is opened, updated and
# closed automatically.
#
# Why this exists: Dependabot reads each Dockerfile's `ARG BASE_IMAGE` and
# nothing else, so every tool pinned as a plain `ARG *_VERSION` moves only when
# a human moves it. A manual audit found six behind at once. This is the same
# audit on a timer.
#
# Reporting, never gating. Drift is not a broken build -- it is a bump someone
# should make deliberately, with a fresh checksum, through the normal PR path.
# Failing a build for it would only train people to ignore a red repository.
name: Pin drift

on:
  schedule:
    # Daily, a few hours after the image rebuild at 04:17, so the two jobs do
    # not contend and the drift report reflects whatever the rebuild published,
    # and an hour before pin-bump.yml (08:53), which acts on the same drift.
    # Daily rather than weekly (docs/adr/0008-self-updating.md): a vendor
    # release clears the seven-day cooldown on some day of the week, and the
    # bump should follow it that day, not up to six days later.
    #
    # GitHub disables scheduled workflows after 60 days without repository
    # activity, silently. If the last run here is old, trigger it manually.
    - cron: '41 7 * * *'
  workflow_dispatch:
  # So a change to the checker or the pins is validated on the PR that makes it,
  # rather than first running on a schedule nobody is watching.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-pins.sh'
      - '.github/workflows/pin-drift.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check pinned tool versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed only to maintain the single tracking issue. Not granted on pull
      # requests, where the job reports to the step summary instead.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here runs a git operation after checkout, so leaving
          # credentials in .git/config is pure exposure (zizmor: artipacked).
          persist-credentials: false

      # Exit 3 means drift, which is an expected outcome rather than a failure,
      # so it is captured instead of aborting the job. Exit 1 (a vendor endpoint
      # unreachable) is still a real failure and is surfaced below.
      - name: Check pins
        id: check
        env:
          # Read by the script for api.github.com; raises the rate limit from
          # 60/hour to 1000/hour, which a dozen GitHub-hosted tools need.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/check-pins.sh --format json > report.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "drift=true"  >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::check-pins.sh failed with exit $code"; cat report.json 2>/dev/null; exit "$code" ;;
          esac
          jq . report.json

          # An unresolved vendor is a broken checker and must be loud, but it no
          # longer hides drift: exit 3 outranks exit 1, so a run with both still
          # reports drift and reaches the issue below.
          unresolved=$(jq -r '[.tools[] | select(.state == "unresolved") | .tool] | join(", ")' report.json)
          if [ -n "$unresolved" ]; then
            echo "::warning::could not resolve upstream version for: $unresolved"
          fi
          echo "unresolved=$unresolved" >> "$GITHUB_OUTPUT"

      - name: Render report
        id: render
        run: |
          {
            echo "### Pinned tool versions"
            echo
            echo "| tool | pinned | latest | state |"
            echo "|---|---|---|---|"
            jq -r '.tools[] | "| \(.tool) | `\(.pinned)` | \(if .latest then "`" + .latest + "`" else "—" end) | \(.state) |"' report.json
          } > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      # Deferred so the report, the summary table and the warning above are all
      # produced first: a broken resolver should still leave a usable artifact.
      - name: Fail if a resolver is broken
        if: steps.check.outputs.code == '1'
        run: |
          echo "::error::one or more vendor resolvers failed; see the warning above"
          exit 1

      # --- issue maintenance, publish contexts only ---------------------------
      # Skipped on pull requests: a PR from a fork gets a read-only token, and a
      # PR should not mutate the issue tracker as a side effect of being opened.
      - name: Open or update the tracking issue
        if: github.event_name != 'pull_request' && steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: Pinned tool versions are behind upstream
          MARKER: '<!-- pin-drift: tracking issue -->'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The default shell is `bash -e` without pipefail: a failed lookup
          # piped into jq would otherwise read as "no issue yet" and open a
          # duplicate.
          set -o pipefail
          {
            # First, so it survives however the rest of the body changes;
            # it is how the next run recognises this issue (see below).
            echo "$MARKER"
            echo "Some hand-pinned tool versions have fallen behind the version their vendor ships."
            echo
            cat table.md
            echo
            echo "Dependabot does not track these -- it only updates each Dockerfile's \`ARG BASE_IMAGE\` --"
            echo "so they move when a human moves them."
            echo
            echo "The daily pin-bump workflow opens a PR for each of these, and each merges itself once every"
            echo "required check is green (docs/adr/0008-self-updating.md); look for open \`pin-bump/*\` PRs first."
            echo
            echo "**To bump one by hand:** update the \`ARG\` *and its checksums* where the vendor publishes them"
            echo "(see CONTRIBUTING.md), then let CI revalidate. A checksum left at the old value fails"
            echo "the build immediately at \`sha256sum --check\`, which is the intended behaviour."
            echo
            echo "This issue is maintained automatically: it is updated while drift remains and closed"
            echo "once every pin is current. Last checked: $RUN_URL"
          } > body.md

          # Idempotent by construction: find the existing open issue and edit
          # it, so a daily run updates one issue rather than opening a new one
          # every day.
          #
          # "The existing issue" is one THIS WORKFLOW opened, not merely one
          # with the same title: anyone with a GitHub account can open an
          # issue here, and matching on the title alone would let them pick
          # the issue the bot then keeps updating and closing -- or one whose
          # body they can rewrite, around the bot's findings. So an issue
          # counts only when GitHub records its author as github-actions[bot]
          # (a Bot account, which no person can sign in as; `.user.type` rules
          # out a look-alike login) AND its body carries the marker above,
          # which only the bot and the repository's own maintainers can write
          # into a bot's issue. The marker also tells this issue apart from
          # any other the bot opens with GITHUB_TOKEN (published-audit.yml
          # keeps one too). The REST API is read directly, rather than
          # `gh issue list --json author`, because it states the login and
          # the account type exactly; pull requests come back from the same
          # endpoint and are dropped. Every page is read: the old
          # `--limit 100` would have missed the issue in a busy tracker and
          # opened a second one.
          existing=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            | jq -rs --arg t "$TITLE" --arg m "$MARKER" '
                add // []
                | map(select(.pull_request == null
                             and .user.login == "github-actions[bot]" and .user.type == "Bot"
                             and .title == $t and ((.body // "") | contains($m))))
                | .[0].number // empty')

          if [ -n "$existing" ]; then
            echo "updating existing issue #$existing"
            gh issue edit "$existing" --body-file body.md
          else
            echo "opening a new tracking issue"
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Close the tracking issue when everything is current
        if: github.event_name != 'pull_request' && steps.check.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: Pinned tool versions are behind upstream
          MARKER: '<!-- pin-drift: tracking issue -->'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # The same lookup as the step above: only the bot's own issue,
          # by author and marker, never one that merely has the title.
          existing=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            | jq -rs --arg t "$TITLE" --arg m "$MARKER" '
                add // []
                | map(select(.pull_request == null
                             and .user.login == "github-actions[bot]" and .user.type == "Bot"
                             and .title == $t and ((.body // "") | contains($m))))
                | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "closing #$existing -- every pin is current"
            gh issue close "$existing" --comment "Every pinned tool is now current. Verified by $RUN_URL"
          else
            echo "no open drift issue and no drift; nothing to do"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin-drift-report
          path: report.json
          if-no-files-found: warn
          retention-days: 90
