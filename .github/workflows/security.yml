# Repository-level security checks, deliberately kept out of build-and-push.yml.
#
# That workflow scans the *images* it produces. This one scans the *repository*
# that produces them -- the workflows, the scripts, the git history -- which is
# the other half of the supply chain and a different threat model: an attacker
# who can influence a workflow file controls every image this repo publishes,
# without ever touching a Dockerfile.
#
# Separate file so a finding here can never block an image build, and so it
# still runs on weeks when no image directory changed (build-and-push.yml is
# path-filtered; this is not).
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Offset from the image rebuild so the two do not contend for runners.
    - cron: '41 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secrets committed to the repository itself, which the image scan cannot see:
  # it only inspects what was COPYed in, and nothing here is. Scans the working
  # tree rather than an image, so it also covers workflows, docs, and the
  # Makefile.
  repo-secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing here runs a git operation after checkout -- GITHUB_TOKEN is
          # only ever used as a registry password -- so leaving credentials in
          # .git/config is pure exposure (zizmor: artipacked).
          persist-credentials: false

      - name: Trivy filesystem secret scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-repo-secrets.sarif
          exit-code: '0'

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-repo-secrets.sarif
          category: repo-secrets

      # Gates, like the image secret gate does. A credential committed here is
      # always fixable from this repo, so there is no reason to ship one.
      - name: Secret gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'

  # Static analysis of the workflows themselves: template injection via
  # ${{ }} interpolation into run blocks, over-broad permissions, unpinned
  # actions, cache poisoning, artifact leakage. actionlint (in build-and-push.yml)
  # checks that a workflow is *valid*; zizmor checks that it is *safe*.
  workflow-audit:
    name: Workflow security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing here runs a git operation after checkout -- GITHUB_TOKEN is
          # only ever used as a registry password -- so leaving credentials in
          # .git/config is pure exposure (zizmor: artipacked).
          persist-credentials: false

      - name: Install zizmor
        uses: astral-sh/setup-uv@v5

      # Reported, not gating. The findings still reach the Security tab via the
      # SARIF upload below, and the `zizmor` check run there reflects them --
      # this step staying green only means the audit ran, not that it was clean.
      #
      # Policy lives in .github/zizmor.yml. Notably `unpinned-uses` is set to
      # ref-pin rather than the default hash-pin: tag pins are the current
      # standard here, and leaving the default would emit 136 high findings in
      # one go and bury everything worth reading.
      - name: Run zizmor
        continue-on-error: true
        run: |
          uvx zizmor --format sarif . > zizmor.sarif || true
          uvx zizmor --format plain . || true

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zizmor.sarif
          category: workflow-audit

  # OpenSSF Scorecard: branch protection, token permissions, pinned
  # dependencies, dangerous workflow patterns, maintenance signals. Produces the
  # score behind the README badge.
  #
  # Only meaningful on the default branch -- several checks inspect repository
  # settings rather than the tree -- so it does not run on pull requests.
  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Required for the badge and for Scorecard's own OIDC-based checks.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 90

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # CodeQL's `actions` analysis. Overlaps zizmor deliberately: zizmor is a
  # rules engine over the YAML, CodeQL does dataflow -- it follows an untrusted
  # value from a trigger through expressions into a sink, which catches
  # injection paths a pattern matcher reads as safe. Findings land in the same
  # Security tab, so the overlap costs nothing but the runner minutes.
  #
  # `actions` is the only language here worth analysing: the repo is shell,
  # YAML and Dockerfiles, none of which CodeQL supports.
  #
  # Known conflict: if the repository ever enables CodeQL "default setup" in
  # Settings -> Code security, GitHub rejects SARIF from advanced-setup
  # workflows like this one and the analyze step fails. The fix is one click
  # (disable default setup), not a workflow change.
  codeql-actions:
    name: CodeQL (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nothing here runs a git operation after checkout -- GITHUB_TOKEN is
          # only ever used as a registry password -- so leaving credentials in
          # .git/config is pure exposure (zizmor: artipacked).
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-actions

  # Secrets in git *history*, which the working-tree scan cannot see. A
  # credential committed and removed in a later commit is still fetchable by
  # anyone who clones -- and rotating it is the only real fix, so finding it
  # late is much worse than finding it now.
  #
  # fetch-depth: 0 because a shallow clone has no history to scan; without it
  # this job would pass while checking almost nothing.
  git-history-secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned release binary, checksum-verified -- the same pattern as the
      # ci-tools binaries and Composer. Not `docker run gitleaks:latest`: a
      # mutable tag adopts a release the second it is published (the exact
      # window the Dependabot cooldown exists to avoid), the pull would hit
      # Docker Hub's anonymous rate limits from shared runners, and git inside
      # a container trips the dubious-ownership check against the runner's
      # checkout. A bump is a two-line PR (version + checksum) that CI
      # revalidates.
      #
      # Reported, not gating. A history finding cannot be fixed by a commit --
      # it needs a rewrite plus rotation -- so failing the build would block
      # every unrelated change until that happens. Read the log; treat a hit
      # as an incident rather than a broken build.
      - name: Gitleaks
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          curl -fsSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" > gitleaks.sum
          sha256sum --check --strict gitleaks.sum
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 0 \
            | tee gitleaks.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Git history secret scan"
            echo
            echo '```'
            tail -40 gitleaks.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-log
          path: gitleaks.log
          retention-days: 90
          if-no-files-found: warn
