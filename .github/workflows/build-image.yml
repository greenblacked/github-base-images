# Reusable build/test/scan/publish pipeline for ONE image. Called once per
# image by build-and-push.yml, which supplies the four values that used to be a
# copied job pair's env: block. Everything that was true of the copies is true
# here, once: native runners per architecture (no QEMU -- emulating the larger
# apt layers would be punishingly slow, and multi-platform builds cannot
# `load:` into the daemon, which would leave the arm64 image untested), a
# digest fan-out into a per-arch artifact, and a merge job that assembles the
# final multi-arch manifest list only after every architecture has passed its
# own gates.
#
# The `github` context inside a called workflow is the CALLER's context, so the
# publish condition (push to main, never a PR) works unchanged. The caller's
# top-level `env:` does NOT propagate, which is why DOCKERFILE is defined here.
#
# All actions are pinned by commit SHA with the version in a trailing comment;
# Dependabot understands and maintains this form. zizmor enforces it (default
# hash-pin policy -- the ref-pin carve-out is gone).
name: Build one image

on:
  workflow_call:
    inputs:
      image:
        description: "Image directory and package name, e.g. ci-node22"
        required: true
        type: string
      version:
        description: "Rolling contract tag, e.g. bookworm-v1"
        required: true
        type: string
      mirror:
        description: "Mirror ref under ghcr.io/<owner>/, e.g. mirror-node:22-bookworm-slim"
        required: true
        type: string
      upstream:
        description: "Upstream base ref, e.g. node:22-bookworm-slim"
        required: true
        type: string

env:
  DOCKERFILE: Dockerfile.ci

# Default-deny. Every job below sets the permissions it actually needs, and a
# job-level block overrides this one -- so this changes nothing for the jobs
# that exist today. It is here for the job that does not exist yet: without it,
# a new job added without a permissions block silently inherits the repository
# default, which can be read-write on everything. With it, forgetting the block
# means the job gets no token scopes and fails loudly instead of running
# over-privileged.
permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Required by the SARIF upload to code scanning.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here runs a git operation after checkout -- GITHUB_TOKEN is
          # only ever used as a registry password -- so leaving credentials in
          # .git/config is pure exposure (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Must precede the build: on main the Dockerfile builds FROM the mirror.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GHA layer cache is scoped per UTC day. Without any rotation the
      # `apt-get update && apt-get upgrade` layer is reused indefinitely, so a
      # rebuild re-tags an image whose packages were installed whenever the
      # cache was first written -- silently defeating the premise that the
      # rebuild IS the security-update mechanism.
      #
      # ci-db proved that much: the vulnerability gate caught fixable postgresql
      # CVEs that `apt-get upgrade` would have fixed, had it re-run at all. The
      # gate was right; the cache was hiding the fix.
      #
      # This was first scoped per ISO week, and a week turned out to be too
      # coarse. Trivy's vulnerability database refreshes daily, so between the
      # Monday rebuild and the following Sunday the gate can learn about a fix
      # the cached layer cannot pick up. Debian publishing linux-libc-dev
      # 6.1.187-1 mid-week did exactly that: ci-go and ci-php84 -- the only two
      # images on a non-slim Debian base, and so the only two carrying
      # libc6-dev -- failed the gate on 63 fixable HIGH findings, and would have
      # kept failing every pull request until the epoch rolled over on its own.
      # A gate that stays red for days over a fix the build is forbidden to
      # fetch teaches people to ignore it.
      #
      # Matching the cache epoch to the database cadence closes that window: the
      # build can always reach any fix the gate can see. The cost is one cold
      # build per image per day on which anything builds at all -- and on a
      # normal day that is the scheduled rebuild, which wants to be cold anyway.
      # Within a day, caching behaves as before. Both the test build and the
      # push below share the scope, so the push still hits the cache the test
      # build just wrote.
      - name: Cache epoch
        id: epoch
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Build into the local daemon only. Nothing is pushed until the smoke
      # tests and the gates below have passed. Non-publishing runs build from
      # upstream so they never depend on (or mutate) the mirror.
      - name: Build ${{ inputs.image }} (${{ matrix.arch }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ inputs.image }}
          file: ./${{ inputs.image }}/${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && inputs.upstream || format('ghcr.io/{0}/{1}', github.repository_owner, inputs.mirror) }}
          load: true
          push: false
          tags: ${{ inputs.image }}:test
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}-${{ steps.epoch.outputs.day }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.arch }}-${{ steps.epoch.outputs.day }}

      - name: Smoke test (${{ matrix.arch }})
        env:
          IMAGE: ${{ inputs.image }}
        run: ./"$IMAGE"/test.sh "$IMAGE:test"

      # Full reports, every severity, never block. Retained as artifacts so
      # there is a record of what shipped in each build, per architecture.
      - name: Security report (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scanners: vuln
          format: json
          output: trivy-${{ inputs.image }}-${{ matrix.arch }}.json
          exit-code: '0'

      - name: Security report (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scanners: vuln
          format: table
          output: trivy-${{ inputs.image }}-${{ matrix.arch }}.txt
          exit-code: '0'

      - name: Secret report (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scanners: secret
          format: table
          output: trivy-secrets-${{ inputs.image }}-${{ matrix.arch }}.txt
          exit-code: '0'

      # Lints the Dockerfile's build instructions (missing USER, ADD vs COPY,
      # ...). Best-practice guidance rather than exploitable findings, so it is
      # reported, not gating -- same treatment as library vulnerabilities.
      - name: Misconfiguration report (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ./${{ inputs.image }}
          format: table
          output: trivy-misconfig-${{ inputs.image }}-${{ matrix.arch }}.txt
          exit-code: '0'

      # License inventory of every OS package and bundled library in the image.
      # Reported, never gating: a copyleft finding in Debian's own packages is
      # information for a consumer, not something fixable from this repo.
      - name: License report (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scanners: license
          format: table
          output: trivy-licenses-${{ inputs.image }}-${{ matrix.arch }}.txt
          exit-code: '0'

      # A CycloneDX SBOM per image and architecture. This is the artifact a
      # consumer needs to answer "was I affected by X" months later, without
      # rebuilding or re-scanning.
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scan-type: image
          format: cyclonedx
          output: sbom-${{ inputs.image }}-${{ matrix.arch }}.cdx.json
          exit-code: '0'

      # Deliberately WIDER than the gate below, so this is the standing
      # inventory of accepted risk rather than a near-duplicate of the exit
      # code. Two differences from the gate, both intentional:
      #   - no `ignore-unfixed`: on an image whose build just ran
      #     `apt-get upgrade`, "fixed" and "already applied" are the same
      #     set, so a fixed-only report is close to a guarantee of an empty
      #     one. What is left is overwhelmingly unfixed CVEs -- exactly the
      #     accepted risk worth a standing record.
      #   - no `vuln-type`, so library findings (the runtime's own bundled
      #     deps -- npm, pip, gem packages baked into the upstream image) are
      #     included too. The gate excludes them because they are not
      #     fixable from this repo; that is the same argument for reporting
      #     them, not for hiding them. The action's default is `os,library`
      #     (see its action.yaml), so omitting the input is enough.
      #
      # `limit-severities-for-sarif: true` is NOT optional decoration --
      # without it, `severity:` below is silently discarded for SARIF output.
      # trivy-action's entrypoint unsets TRIVY_SEVERITY whenever the format is
      # sarif unless this flag is explicitly true (the input has no default),
      # so a SARIF step that only sets `severity:` actually ships every
      # severity, UNKNOWN and LOW included. `category` must be unique per
      # image and architecture or each upload overwrites the previous one.
      - name: Vulnerability report (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scanners: vuln
          format: sarif
          output: trivy-${{ inputs.image }}-${{ matrix.arch }}.sarif
          exit-code: '0'
          limit-severities-for-sarif: true
          severity: HIGH,CRITICAL

      # continue-on-error: code scanning upload must never be the reason an
      # image fails to publish.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-${{ inputs.image }}-${{ matrix.arch }}.sarif
          category: ${{ inputs.image }}-${{ matrix.arch }}

      - name: Publish reports to job summary and log
        env:
          IMAGE: ${{ inputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          for report in "trivy-$IMAGE-$ARCH.txt" \
                        "trivy-secrets-$IMAGE-$ARCH.txt" \
                        "trivy-misconfig-$IMAGE-$ARCH.txt" \
                        "trivy-licenses-$IMAGE-$ARCH.txt"; do
            cat "$report"
            {
              echo "<details><summary>${report%.txt}</summary>"
              echo
              echo '```'
              cat "$report"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # Upload before the gates, so the reports survive even when a gate fails
      # -- that is exactly the build you most want the reports for.
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report-${{ inputs.image }}-${{ matrix.arch }}
          path: |
            trivy-${{ inputs.image }}-${{ matrix.arch }}.json
            trivy-${{ inputs.image }}-${{ matrix.arch }}.txt
            trivy-secrets-${{ inputs.image }}-${{ matrix.arch }}.txt
            trivy-misconfig-${{ inputs.image }}-${{ matrix.arch }}.txt
            trivy-licenses-${{ inputs.image }}-${{ matrix.arch }}.txt
            trivy-${{ inputs.image }}-${{ matrix.arch }}.sarif
            sbom-${{ inputs.image }}-${{ matrix.arch }}.cdx.json
          retention-days: 90

      # The gate. OS packages only: library findings are the runtime's own
      # bundled dependencies, shipped inside the upstream image and not fixable
      # from this repo -- they are reported above instead. `ignore-unfixed`
      # keeps this actionable: red always means a rebuild picks up a fix.
      #
      # `vuln-type`, not `pkg-types`. The Trivy CLI renamed this flag, but the
      # action still exposes it under the old name (its own source says "TODO:
      # rename to pkg-types"). An unrecognized input is silently dropped by
      # Actions rather than erroring, so `pkg-types` here would scan os+library
      # and fail the gate on the runtime's bundled deps.
      - name: Vulnerability gate (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os

      # A baked-in credential in a public CI image is always fixable from this
      # repo, so unlike library vulns it gates -- at any severity.
      - name: Secret gate (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:test
          scanners: secret
          format: table
          exit-code: '1'

      # Push each architecture under its own tag. A tagged push is what creates
      # the package on GHCR the first time an image is published; a digest-only
      # push cannot create a not-yet-existing package. The merge job assembles
      # the final tagged multi-arch manifest list from these per-arch digests
      # once both architectures have passed. Cache hit from the build above, so
      # this re-exports rather than rebuilding.
      - name: Push (${{ matrix.arch }})
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ inputs.image }}
          file: ./${{ inputs.image }}/${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ inputs.mirror }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:${{ inputs.version }}-${{ matrix.arch }}
          push: true
          # Attach the SBOM and provenance to the pushed artifact, not just to a
          # build artifact that expires. `imagetools create` carries these into
          # the final index -- they are the `unknown/unknown` entries you see in
          # `imagetools inspect`. Only set on the push: the test build above uses
          # the docker exporter via `load:`, which cannot carry attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}-${{ steps.epoch.outputs.day }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.arch }}-${{ steps.epoch.outputs.day }}

      - name: Export digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ inputs.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # A second vulnerability opinion from a second database: osv-scanner reads
  # the CycloneDX SBOM the build job already produced -- no second image scan
  # -- and reports it to code scanning under its own `osv-<image>-<arch>`
  # category, next to Trivy's.
  #
  # Report-only, and deliberately its own job rather than a step in `build`.
  # Findings never fail anything. A scan that could not look -- osv-scanner
  # would not run, could not read the SBOM, could not reach the OSV database
  # -- DOES fail, loudly, and that is exactly why it lives out here: `merge`
  # needs only `build`, so an OSV outage turns the run red without holding a
  # security rebuild back from publishing. Inside `build`, the same failure
  # would have blocked every push behind someone else's API. (The caller's
  # `image` job still reports failure, so the run is red; its `digests` job
  # runs regardless and aggregates every manifest that was published.)
  #
  # All the exit-code handling lives in scripts/osv-scan-sbom.sh, where it can
  # be run locally; see its header for why the SBOM is normalised first (as
  # produced, it matches nothing in OSV's Debian data at all).
  osv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required by the SARIF upload to code scanning.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The SBOM is data, so both architectures' SBOMs are read on one
        # amd64 runner; nothing here executes the image.
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report-${{ inputs.image }}-${{ matrix.arch }}
          path: reports

      # Pinned release binary, verified against the vendor's own
      # osv-scanner_SHA256SUMS -- the same pattern as gitleaks in security.yml
      # and the lint engines in scripts/lint.sh. scripts/check-pins.sh reads
      # OSV_SCANNER_VERSION from this file, so pin-drift.yml reports when it
      # falls behind.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: 2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          dir="$RUNNER_TEMP/osv-scanner"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $dir/osv-scanner" > "$dir/osv-scanner.sum"
          sha256sum --check --strict "$dir/osv-scanner.sum"
          chmod +x "$dir/osv-scanner"
          echo "$dir" >> "$GITHUB_PATH"

      # No `|| true`, no continue-on-error: the script exits 0 for a completed
      # scan with or without findings and 1 for a scan that did not complete,
      # and deletes both SARIFs in that case -- osv-scanner writes a valid,
      # zero-result SARIF even when it could not reach its database.
      #
      # Two outputs: the full SARIF (every severity) is the 90-day artifact;
      # the upload SARIF is what code scanning gets -- security-severity
      # >= 7.0 plus every unscored finding, the same readability trade as the
      # Trivy SARIF. The script writes the kept/dropped/unscored counts and
      # its input mapping counts to the step summary itself.
      #
      # And no pipe on the script's line. This step runs under GitHub's
      # default `bash -e {0}` -- errexit WITHOUT pipefail -- so
      # `script | tee` would take tee's exit status and pass a failed scan.
      - name: OSV report (SARIF)
        env:
          IMAGE: ${{ inputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/osv-scan-sbom.sh "reports/sbom-$IMAGE-$ARCH.cdx.json" \
            "osv-$IMAGE-$ARCH.sarif" "osv-upload-$IMAGE-$ARCH.sarif"

      # continue-on-error, like every SARIF upload here: code scanning must
      # never be what turns a run red. No `if: always()`, unlike the Trivy
      # upload: this only runs when the scan step above succeeded, so there
      # is never a half-written SARIF to upload.
      - name: Upload SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: osv-upload-${{ inputs.image }}-${{ matrix.arch }}.sarif
          category: osv-${{ inputs.image }}-${{ matrix.arch }}

      # The UNFILTERED report: every severity, including what the upload
      # above leaves out.
      - name: Upload OSV report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report-${{ inputs.image }}-${{ matrix.arch }}
          path: osv-${{ inputs.image }}-${{ matrix.arch }}.sarif
          if-no-files-found: error
          retention-days: 90

  # Assemble the per-arch digests into one tagged manifest list, so pulling the
  # version tag resolves to the right architecture automatically. Only runs if
  # every arch passed its gates, and never on PRs.
  merge:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the OIDC token is what proves to Fulcio that
      # this signature came from this workflow on this ref. The caller's
      # `image` job must grant the same -- called-workflow permissions are the
      # intersection of both declarations. The GitHub attestation below signs
      # with the same token.
      id-token: write
      # For actions/attest-build-provenance to store the attestation with
      # GitHub's attestations API. The caller grants it too, for the same
      # intersection reason. `artifact-metadata: write` -- a real scope, and
      # in the action's documented example -- is deliberately NOT here: the
      # action uses it only to create an artifact storage record, which
      # GitHub supports only for organization-owned repositories. This one is
      # user-owned, so the step sets create-storage-record: false instead of
      # holding a scope it cannot use.
      attestations: write

    steps:
      # For scripts/check-published.sh, which the post-sign verification runs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ inputs.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          SHA_TAG: ${{ github.sha }}
        run: |
          # Each downloaded digest file's NAME is a per-arch digest.
          #
          # nullglob so an empty directory yields no refs at all rather than the
          # literal "*", which would otherwise reach imagetools as the nonsense
          # ref "$REPO@sha256:*" and fail with an unhelpful registry error.
          shopt -s nullglob
          refs=()
          for f in *; do refs+=("$REPO@sha256:$f"); done

          # Assert the count BEFORE creating the manifest list, not after.
          # `imagetools create` moves :latest, :$VERSION and :$SHA_TAG in one
          # shot, so a short digest set published here leaves those tags
          # pointing at a single-architecture index -- the both-platforms
          # assertion further down would catch it, but only after consumers
          # could already pull it. Failing first leaves the previous, good
          # tags in place.
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests for $REPO:$VERSION, got ${#refs[@]}"
            exit 1
          fi

          docker buildx imagetools create \
            --tag "$REPO:$VERSION" \
            --tag "$REPO:latest" \
            --tag "$REPO:$SHA_TAG" \
            "${refs[@]}"

      # One authoritative resolution of the published index digest; the sign,
      # report and manifest-export steps below all consume this output rather
      # than each re-deriving it -- three copies of the same awk is how they
      # drift apart.
      - name: Resolve published digest
        id: resolve
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$REPO:$VERSION" \
            | awk '/^Digest:/ {print $2; exit}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless signature over the final index digest -- the digest consumers
      # pin, not the per-arch digests. Fulcio binds the signature to this
      # workflow's OIDC identity (the REUSABLE workflow's ref, not the
      # caller's), Rekor logs it publicly, and the signature is pushed as an
      # OCI artifact into the same GHCR package. Verification recipe lives in
      # the README.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifest list
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          cosign sign --yes "$REPO@$DIGEST"

      # Gate: re-derive from the registry, in this run, what published-audit.yml
      # would otherwise only find out later -- the signature verifies under
      # the exact expected identity (build-image.yml@refs/heads/main under
      # GitHub's OIDC issuer; this reusable workflow's path, not the caller's),
      # and both the SBOM and provenance attestations are present on the
      # index. Not a new implementation: this is check-published.sh itself in
      # --ref mode, the same functions the scheduled audit runs, which were
      # fixed against real cosign v3.0.6 / buildx v0.31.1 / GHCR output. Two
      # copies of that logic is how one of them ends up on the wrong identity.
      #
      # Runs before the GitHub attestation below, so it proves cosign's own
      # signature rather than whatever else a later step attaches. Whether
      # the two coexist for a consumer is published-audit.yml's to observe --
      # it runs the same check against the final state after this workflow.
      #
      # Both failure kinds fail the job, with different messages: 3 means the
      # registry definitively lacks a valid signature or an attestation; 1
      # means the checker could not tell. Neither is a pass. The tags have
      # already moved by this point (imagetools create above), so this cannot
      # un-publish -- it makes the run that caused the regression the one that
      # goes red, instead of a scheduled audit days later.
      - name: Verify signature and attestations
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.resolve.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          rc=0
          ./scripts/check-published.sh --ref "$REF" || rc=$?
          case "$rc" in
            0) echo "verified: $REF is signed by the expected identity and carries SBOM and provenance attestations" ;;
            3) echo "::error::$REF failed post-sign verification: the signature does not verify under the expected identity, or an SBOM/provenance attestation is missing (see the table above)"
               exit 1 ;;
            1) echo "::error::could not verify $REF: the signature or attestation check itself failed to run (see the log above) -- treated as a failure, not a pass"
               exit 1 ;;
            *) echo "::error::check-published.sh --ref exited $rc (usage or unexpected error)"
               exit 1 ;;
          esac

      # GitHub-native build provenance, IN ADDITION to cosign and the buildx
      # attestations, which are untouched. A second, independent verification
      # path for consumers (`gh attestation verify`, see the README): signed
      # with this job's OIDC token through Sigstore (public-good, since the
      # repository is public), stored with GitHub's attestations API, and --
      # with push-to-registry -- also pushed next to the image in GHCR.
      #
      # Fails closed on its own: the action errors if it cannot sign, store
      # or push. The step after it then checks the result the way a consumer
      # would.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          subject-digest: ${{ steps.resolve.outputs.digest }}
          push-to-registry: true
          # Storage records are organization-only; see the permissions note.
          create-storage-record: false

      # The consumer recipe from the README, run against what was just
      # attested, pinned to the same identity cosign is: this reusable
      # workflow on refs/heads/main, for this repository. Any non-zero exit --
      # no attestation found, wrong signer, or gh unable to ask -- fails.
      #
      # Bounded retry: this reads GitHub's attestations API seconds after the
      # step above wrote to it, and nothing documents that read as
      # immediately consistent. A lag there must not turn a good publish red,
      # so up to 5 attempts, 15s apart (about a minute in all). It retries
      # only; the last failure still fails the step, and every failed attempt
      # is logged as a warning, so a check that needed retries is visible.
      - name: Verify GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ steps.resolve.outputs.digest }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          attempts=5
          delay=15
          rc=1
          for attempt in $(seq 1 "$attempts"); do
            rc=0
            gh attestation verify "oci://$REF" \
              --repo "$REPO_SLUG" \
              --cert-identity "https://github.com/$REPO_SLUG/.github/workflows/build-image.yml@refs/heads/main" \
              || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "verified on attempt $attempt of $attempts"
              break
            fi
            echo "::warning::gh attestation verify attempt $attempt of $attempts failed for $REF (exit $rc)"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$delay"
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::gh attestation verify failed for $REF after $attempts attempts (last exit $rc) -- no attestation from build-image.yml@refs/heads/main could be verified"
            exit 1
          fi

      - name: Report digest and platforms
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          inspect=$(docker buildx imagetools inspect "$REPO:$VERSION")
          echo "$inspect"
          # Both platforms must be present in the published index -- a green
          # merge with a one-arch manifest is exactly the failure nobody
          # notices until an Apple Silicon machine pulls it.
          for p in "linux/amd64" "linux/arm64"; do
            if ! echo "$inspect" | grep -q "$p"; then
              echo "::error::published index for $REPO:$VERSION is missing $p"
              exit 1
            fi
          done
          {
            echo "### $REPO:$VERSION"
            echo
            echo "Tested and scanned on every architecture. Pin this digest in production:"
            echo
            echo '```yaml'
            echo "image: $REPO@$DIGEST"
            echo '```'
            echo
            echo '```'
            echo "$inspect"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One {image, version, digest} object per image, aggregated by the
      # caller's `digests` job into a machine-readable digests.json -- the
      # automatable form of the "pin this digest" advice above.
      #
      # LAST on purpose, after every check this job makes: signing, both
      # verifications, the attestation and the both-platforms assertion. The
      # caller's `digests` job runs even when an image failed (!cancelled()),
      # so a manifest must only exist for an index that passed everything --
      # an upload before a failing check would put that index in digests.json.
      - name: Export digest manifest
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          jq -n --arg image "$IMAGE" --arg version "$VERSION" --arg digest "$DIGEST" \
            '{image: $image, version: $version, digest: $digest}' \
            > "digest-manifest-$IMAGE.json"

      - name: Upload digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-manifest-${{ inputs.image }}
          path: digest-manifest-*.json
          if-no-files-found: error
          retention-days: 90
