# Label Dependabot's major updates, and the ones whose update type is unknown,
# `needs-review` -- as information, nothing more (docs/adr/0008-self-updating.md).
#
# This workflow no longer turns on GitHub auto-merge, and merges nothing.
# merge-bot-prs.yml merges every Dependabot pull request, majors included,
# once its four required checks have passed on its head commit: the full
# build, smoke tests and vulnerability gate are the safety net, and the owner
# wants no manual step. The label stays so a major is easy to spot in the
# history; `hold` is the label that stops a merge. The file keeps its old name
# so links to it, and its history, stay valid. Dependabot's own seven-day
# cooldown still applies upstream of all this: nothing reaches here the day it
# is published.
#
# Why `pull_request` and not `pull_request_target`:
#   - On a Dependabot PR, `pull_request` runs with a token whose permissions
#     are the ones granted below, and no repository secrets beyond
#     Dependabot's own. That is all this needs.
#   - `pull_request_target` would run with a write token for EVERY pull
#     request, forks included, and the `if:` below would be the only thing
#     standing between a stranger's PR and that token. Under `pull_request`, a
#     fork's PR gets a read-only token whatever this file says, so even a
#     mistake in the condition cannot hand out write access.
#   - Nothing here checks out or runs code from the PR. fetch-metadata reads
#     the PR's commit through the API, and refuses (empty outputs) unless the
#     commit is authored by Dependabot and signed.
#
# Not an image pipeline file: it is outside build-and-push.yml's `paths:` and
# the plan's full-rebuild list, so changing it rebuilds nothing.
name: Dependabot update labels

on:
  pull_request:
    branches: [main]

# One run per PR; a newer push to the same PR supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: Dependabot update labels
    # Both: the PR was opened by Dependabot, and this event was caused by it.
    # A maintainer's push to a Dependabot branch runs nothing here.
    #
    # zizmor flags `github.actor` as spoofable (bot-conditions): the actor is
    # whoever last acted, so a PR from someone else's branch can carry
    # Dependabot as its actor. That is why it is never the condition on its
    # own here. The PR author, which zizmor recommends, is the condition; the
    # actor check only narrows it further, to events Dependabot itself caused.
    # Removing it would widen the job, not harden it.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # fetch-metadata reads the PR's commit
      pull-requests: write  # the needs-review label
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Everything that is not a known minor or patch: a major, an empty
      # update-type, or a value this file does not know. fetch-metadata
      # returns an empty update-type whenever it cannot parse a version -- a
      # SHA-pinned `uses:` with no version comment, for one -- and that SHA may
      # just as well be a new major, so it is labelled too.
      - name: Label a major update
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-patch' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          # `gh label create` fails when the label exists; only a label that is
          # then really there counts. errexit (the default shell's -e) fails
          # the step when the label is neither created nor found.
          rc=0
          gh label create needs-review --repo "$REPO" --color d93f0b \
            --description "Major or unchecksummed automated update. Information only: it still merges when green" || rc=$?
          if [ "$rc" -ne 0 ]; then
            gh label list --repo "$REPO" --search needs-review --json name \
              | jq -e 'any(.[]; .name == "needs-review")' >/dev/null
          fi
          gh pr edit "$PR_URL" --add-label needs-review

      - name: Summary
        if: always()
        env:
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          FROM: ${{ steps.meta.outputs.previous-version }}
          TO: ${{ steps.meta.outputs.new-version }}
        run: |
          {
            echo "### Dependabot update labels"
            echo
            if [ -z "$NAMES" ]; then
              echo "fetch-metadata returned nothing (not a verified Dependabot commit?): labelled needs-review."
            else
              echo "- dependencies: $NAMES ($ECOSYSTEM)"
              echo "- ${FROM:-?} -> ${TO:-?}, update type: ${UPDATE_TYPE:-unknown (treated as major: labelled needs-review)}"
            fi
            echo
            echo "merge-bot-prs.yml merges this pull request once its four required checks pass, labelled or not. Add the \`hold\` label to stop it."
          } >> "$GITHUB_STEP_SUMMARY"
