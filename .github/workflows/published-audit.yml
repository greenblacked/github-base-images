# Audits what is actually live in ghcr.io/greenblacked, as opposed to what the
# build pipeline believes it published.
#
# Every gate in build-image.yml -- the vulnerability scan, the smoke test, the
# secret gate, even the cosign signature and the SBOM/provenance attestations
# -- runs against the artifact BEFORE or AT the moment it is pushed. The
# merge job does re-check its own signature and attestations straight after
# signing (check-published.sh --ref, the same code as this audit), but only
# once, for the digest it just produced. Nothing re-checks the artifact a
# consumer actually pulls in the days afterwards. A package flipped to
# private, a signature whose identity has drifted (a workflow rename, a ref
# that stopped being `main`), a rebuild that silently stopped firing -- none
# of that fails a build, because none of it happens during one. This is that
# other half, on a timer of its own.
#
# Deliberately not covered: whether an old, retired image name (one no longer
# in .github/images.json) is still being served by GHCR. Finding that
# requires listing every ci-* package this owner has ever published, which is
# a user-scoped GitHub Packages API that needs a classic PAT with
# read:packages -- GITHUB_TOKEN cannot call it, and this repository is not
# adding that credential. The two names this would have caught (ci-go125,
# ci-rust185) are being deleted at the source instead of instrumented around.
#
# Reporting, never gating -- same posture as pin-drift.yml. A stale or
# unverifiable published image is not a broken build to re-run; it is
# something a human decides what to do about (re-run the publish, fix a
# package's visibility). Failing a workflow that runs on a schedule for a
# condition nobody caused this week would only train people to ignore it.
name: Published image audit

on: # zizmor: ignore[dangerous-triggers]
  # workflow_run is flagged as "almost always used insecurely" because the
  # common misuse is checking out and running a PR's head commit with this
  # workflow's privileged secrets. Nothing here does that: no step reads
  # github.event.workflow_run.head_sha/head_branch/head_repository, and the
  # checkout below takes no `ref:`, so it resolves the same way it would on
  # workflow_dispatch or schedule -- this repository's own main.
  #
  # The direct trigger: re-check within minutes of whatever build-and-push.yml
  # just did to main, success or not -- a failed run may still have left an
  # earlier, now-stale tag as the last thing consumers can pull.
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: [main]
  schedule:
    # Independent of workflow_run firing at all: if build-and-push.yml's own
    # schedule were ever silently disabled (GitHub does this after 60 days of
    # repository inactivity), no workflow_run event would follow either, and
    # this would be the only thing left that notices the rebuild stopped. A
    # day after both the rebuild (Monday 04:17) and pin-drift (Monday 07:41),
    # so the state this observes has had time to settle rather than racing
    # either of them.
    - cron: '30 6 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny; the job below states what it actually needs.
permissions: {}

jobs:
  audit:
    name: Audit published images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `if:` here on purpose. A workflow_run event fires for every
    # conclusion, including 'failure' and 'cancelled'. A failed build
    # published nothing new, but whatever is already live is exactly what
    # this should still look at, so a failed trigger run still audits.
    permissions:
      contents: read
      # Read-only pulls of the published artifacts and their signatures/
      # attestations.
      packages: read
      # To maintain the single tracking issue.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here runs a git operation after checkout, so leaving
          # credentials in .git/config is pure exposure (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Several published packages are known to be private. GITHUB_TOKEN can
      # only ever read a package that is linked to this repository -- true
      # user-level privacy is opaque to it either way -- so this makes the
      # best access available to a workflow token and leaves the script to
      # classify what it gets back (401/403 vs 404) rather than assume.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Exit 3 means one or more images are unhealthy or stale -- an expected
      # outcome, not a failure, so it is captured instead of aborting the
      # job. Exit 1 means the checker itself was broken (an attestation or
      # freshness check that could not be determined at all) and is
      # surfaced below.
      - name: Check published images
        id: check
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set +e
          ./scripts/check-published.sh --format json > report.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "issues=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "issues=true"  >> "$GITHUB_OUTPUT" ;;
            1) echo "issues=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::check-published.sh failed with exit $code"; cat report.json 2>/dev/null; exit "$code" ;;
          esac
          jq . report.json

      - name: Render report
        id: render
        run: |
          {
            echo "### Published image audit"
            echo
            echo "| image | pull | signature | sbom | provenance | freshness | age (days) | state |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r '.images[] | "| \(.image):\(.version) | \(.pull_state) | \(.sig_state) | \(.has_sbom) | \(.has_provenance) | \(.freshness_state) | \(.age_days // "—") | \(if .status == "healthy" then "ok" elif .status == "error" then "unknown" else "**ISSUE**" end) |"' report.json

            echo
            echo "#### Signature identity mismatches"
            echo
            # This is the diagnostic the identity check exists for: not just
            # "verification failed", but what the signature actually says,
            # so a renamed workflow or a ref that is no longer `main` is
            # visible at a glance instead of requiring a manual re-run.
            sig_fail=$(jq -r '.images[] | select(.sig_state=="fail") | "- **\(.image):\(.version)** \(.sig_identity)"' report.json)
            [ -n "$sig_fail" ] && echo "$sig_fail" || echo "None."

            echo
            echo "#### Pull failures"
            echo
            pull_fail=$(jq -r '.images[] | select(.pull_state != "ok") | "- **\(.image):\(.version)**: \(.pull_state) -- \(.pull_detail)"' report.json)
            [ -n "$pull_fail" ] && echo "$pull_fail" || echo "None."

            echo
            echo "#### Checks that could not be completed"
            echo
            # A broken checker, not a broken registry: the attestation or
            # freshness inspect itself failed (network, an unreachable
            # blob), as opposed to genuinely finding nothing. These do not
            # count as findings above -- see report.json's top-level
            # \`failed\` count -- but must not be silently absent either.
            checker_err=$(jq -r '.images[] | select(.status=="error") | "- **\(.image):\(.version)**: sbom=\(.has_sbom) provenance=\(.has_provenance) freshness=\(.freshness_state) -- \(.attest_detail)\(.freshness_detail)"' report.json)
            [ -n "$checker_err" ] && echo "$checker_err" || echo "None."
          } > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      # Deferred so the report and step summary are produced first: a broken
      # checker should still leave a usable artifact behind.
      - name: Fail if the checker itself is broken
        if: steps.check.outputs.code == '1'
        env:
          # Piped through env rather than interpolated directly into the
          # script, so this is data to the shell rather than template
          # expansion into it -- harmless here (the value is one digit this
          # job's own prior step produced), but that is the general shape to
          # keep even when it happens not to matter.
          CHECK_CODE: ${{ steps.check.outputs.code }}
        run: |
          echo "::error::check-published.sh exited ${CHECK_CODE} -- see the Check step above"
          exit 1

      # --- issue maintenance ----------------------------------------------
      - name: Open or update the tracking issue
        if: steps.check.outputs.issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Published images failed the post-publish audit
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "One or more images published to ghcr.io/${{ github.repository_owner }} did not pass"
            echo "the post-publish audit: pullable, correctly signed, carrying both SBOM and"
            echo "provenance attestations, and no older than 10 days (weekly rebuild plus margin)."
            echo
            cat table.md
            echo
            echo "This checks the registry directly -- it is independent of, and runs after, every"
            echo "gate in build-image.yml. A finding here means what is actually live differs from"
            echo "what the last build believed it published."
            echo
            echo "This issue is maintained automatically: it is updated while a finding remains and"
            echo "closed once the audit is clean. Last checked: $RUN_URL"
          } > body.md

          # Idempotent by construction, same as pin-drift.yml: find the
          # existing open issue by exact title and edit it, so a weekly run
          # updates one issue rather than opening a new one every time.
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')

          if [ -n "$existing" ]; then
            echo "updating existing issue #$existing"
            gh issue edit "$existing" --body-file body.md
          else
            echo "opening a new tracking issue"
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Close the tracking issue when the audit is clean
        if: steps.check.outputs.issues == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Published images failed the post-publish audit
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "closing #$existing -- every published image passed"
            gh issue close "$existing" --comment "The post-publish audit is clean. Verified by $RUN_URL"
          else
            echo "no open audit issue and no findings; nothing to do"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-audit-report
          path: report.json
          if-no-files-found: warn
          retention-days: 90
