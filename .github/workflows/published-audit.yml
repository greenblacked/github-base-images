# Audits what is actually live in ghcr.io/greenblacked, as opposed to what the
# build pipeline believes it published.
#
# Every gate in build-image.yml -- the vulnerability scan, the smoke test, the
# secret gate, even the cosign signature and the SBOM/provenance attestations
# -- runs against the artifact BEFORE or AT the moment it is pushed. The
# merge job does re-check its own signature and attestations straight after
# signing and again after the GitHub attestation (check-published.sh --ref,
# the same code as this audit), but only for the digest it just produced, at
# publish time. Nothing re-checks the artifact a
# consumer actually pulls in the days afterwards. A package flipped to
# private (checked anonymously, by scripts/check-public.sh -- the login below
# would pull a private package just fine), a signature whose identity has
# drifted (a workflow rename, a ref that stopped being `main`), a rebuild
# that silently stopped firing -- none of that fails a build, because none
# of it happens during one. This is that other half, on a timer of its own.
#
# Deliberately not covered: whether an old, retired image name (one no longer
# in .github/images.json) is still being served by GHCR. Finding that
# requires listing every ci-* package this owner has ever published, which is
# a user-scoped GitHub Packages API that needs a classic PAT with
# read:packages -- GITHUB_TOKEN cannot call it, and this repository is not
# adding that credential. The two names this would have caught (ci-go125,
# ci-rust185) are being deleted at the source instead of instrumented around.
#
# Reporting, never gating -- same posture as pin-drift.yml. A stale or
# unverifiable published image is not a broken build to re-run; it is
# something a human decides what to do about (re-run the publish, fix a
# package's visibility). Failing a workflow that runs on a schedule for a
# condition nobody caused this week would only train people to ignore it.
name: Published image audit

on:
  # workflow_run is flagged as "almost always used insecurely" because the
  # common misuse is checking out and running a PR's head commit with this
  # workflow's privileged secrets. Nothing here does that: no step reads
  # github.event.workflow_run.head_sha or head_branch, head_repository is only
  # compared (in the job's `if:` and the concurrency group, never checked out
  # or interpolated into a shell), and the checkout below takes no `ref:`, so
  # it resolves the same way it would on workflow_dispatch or schedule --
  # this repository's own main.
  #
  # The direct trigger: re-check within minutes of whatever build-and-push.yml
  # just did to main, success or not -- a failed run may still have left an
  # earlier, now-stale tag as the last thing consumers can pull.
  # The ignore comment sits on the trigger line itself: zizmor 1.31 reports
  # this finding there, not at `on:`.
  #
  # `branches: [main]` filters on the triggering run's HEAD BRANCH NAME, not
  # on where it came from: build-and-push.yml also runs on pull_request, so
  # a fork whose branch happens to be called `main` matches it too, and
  # anyone can open such a pull request. Those runs are let through by the
  # trigger but stopped by the job's `if:` below, and kept out of the
  # concurrency group, so they can neither post to the tracking issue nor
  # displace a real audit.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build and Push to GHCR"]
    types: [completed]
    branches: [main]
  schedule:
    # Independent of workflow_run firing at all: if build-and-push.yml's own
    # schedule were ever silently disabled (GitHub does this after 60 days of
    # repository inactivity), no workflow_run event would follow either, and
    # this would be the only thing left that notices the rebuild stopped.
    # Tuesdays 06:30, after that day's rebuild (04:17), so the state this
    # observes has had time to settle rather than racing it.
    - cron: '30 6 * * 2'
  workflow_dispatch:

# Queued, never cancelled. Every audit checks the same thing (whatever is
# live now), so a run that is half-way through is as good as a newer one,
# and cancelling it only risks a tracking issue that was edited but not yet
# closed, or a report that never uploads. GitHub keeps at most one run
# pending per group and drops the older pending one when a newer arrives,
# which is the right collapse for this: the newer run audits the same or a
# later state.
#
# That same collapse is why a run the job's `if:` below would skip must not
# share the group: queued behind a real audit, it would displace the real
# one that was pending, and then do nothing. So a workflow_run that is not
# from this repository's own push, schedule or dispatch gets a group of its
# own (its run id). The condition is the job's `if:`, repeated, because
# `concurrency` cannot refer to a job's result.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    (github.event_name != 'workflow_run' || (
    contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
    github.event.workflow_run.head_repository.full_name == github.repository))
    && github.ref || format('untrusted-{0}', github.run_id) }}
  cancel-in-progress: false

# Default-deny; the job below states what it actually needs.
permissions: {}

jobs:
  audit:
    name: Audit published images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Schedule and dispatch always run. A workflow_run runs only for a Build
    # and Push run that this repository itself started on main -- a push, its
    # schedule, or a dispatch -- and never for a pull_request run, which is
    # what a fork's `main` branch produces (see the trigger above). The
    # repository check is what rules the fork out; the event check also
    # rules out a same-repository pull request from a branch named main,
    # which published nothing either.
    #
    # The conclusion is deliberately not checked. A workflow_run event fires
    # for every conclusion, including 'failure' and 'cancelled'. A failed
    # build published nothing new, but whatever is already live is exactly
    # what this should still look at, so a failed trigger run still audits.
    if: >-
      github.event_name != 'workflow_run' || (
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      # Read-only pulls of the published artifacts and their signatures/
      # attestations.
      packages: read
      # To maintain the single tracking issue.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here runs a git operation after checkout, so leaving
          # credentials in .git/config is pure exposure (zizmor: artipacked).
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # For the signature, attestation and freshness reads. GITHUB_TOKEN can
      # read a package linked to this repository whether or not it is public,
      # so this login says nothing about visibility: check-published.sh
      # judges that separately, anonymously (scripts/check-public.sh, curl
      # with no credentials), and counts a package that is not public as an
      # issue -- one flipped to private is caught by the next run.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Exit 3 means one or more images are unhealthy or stale -- an expected
      # outcome, not a failure, so it is captured instead of aborting the
      # job. Exit 1 means the checker itself was broken (an attestation or
      # freshness check that could not be determined at all) and is
      # surfaced below.
      - name: Check published images
        id: check
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set +e
          ./scripts/check-published.sh --format json > report.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "issues=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "issues=true"  >> "$GITHUB_OUTPUT" ;;
            1) echo "issues=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::check-published.sh failed with exit $code"; cat report.json 2>/dev/null; exit "$code" ;;
          esac
          jq . report.json

      - name: Render report
        id: render
        run: |
          {
            echo "### Published image audit"
            echo
            echo "| image | pull | public | signature | sbom | provenance | freshness | age (days) | state |"
            echo "|---|---|---|---|---|---|---|---|---|"
            jq -r '.images[] | "| \(.image):\(.version) | \(.pull_state) | \(.public_state) | \(.sig_state) | \(.has_sbom) | \(.has_provenance) | \(.freshness_state) | \(.age_days // "—") | \(if .status == "healthy" then "ok" elif .status == "error" then "unknown" else "**ISSUE**" end) |"' report.json

            echo
            echo "#### Signature identity mismatches"
            echo
            # This is the diagnostic the identity check exists for: not just
            # "verification failed", but what the signature actually says,
            # so a renamed workflow or a ref that is no longer `main` is
            # visible at a glance instead of requiring a manual re-run.
            sig_fail=$(jq -r '.images[] | select(.sig_state=="fail") | "- **\(.image):\(.version)** \(.sig_identity)"' report.json)
            [ -n "$sig_fail" ] && echo "$sig_fail" || echo "None."

            echo
            echo "#### Pull failures"
            echo
            pull_fail=$(jq -r '.images[] | select(.pull_state != "ok") | "- **\(.image):\(.version)**: \(.pull_state) -- \(.pull_detail)"' report.json)
            [ -n "$pull_fail" ] && echo "$pull_fail" || echo "None."

            echo
            echo "#### Not public"
            echo
            # Not pullable without credentials. The detail names the
            # package's settings page; the fix is Danger Zone -> Change
            # visibility -> Public (docs/images.md).
            not_public=$(jq -r '.images[] | select(.public_state == "private") | "- **\(.image):\(.version)**: \(.public_detail)"' report.json)
            [ -n "$not_public" ] && echo "$not_public" || echo "None."

            echo
            echo "#### Checks that could not be completed"
            echo
            # A broken checker, not a broken registry: the attestation or
            # freshness inspect, or the anonymous-pull check, itself failed
            # (network, an unreachable blob), as opposed to genuinely finding
            # nothing. These do not count as findings above -- see
            # report.json's top-level \`failed\` count -- but must not be
            # silently absent either.
            checker_err=$(jq -r '.images[] | select(.status=="error") | "- **\(.image):\(.version)**: public=\(.public_state) sbom=\(.has_sbom) provenance=\(.has_provenance) freshness=\(.freshness_state) -- \(.attest_detail)\(.freshness_detail) \(if .public_state == "unknown" then .public_detail else "" end)"' report.json)
            [ -n "$checker_err" ] && echo "$checker_err" || echo "None."
          } > table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      # Deferred so the report and step summary are produced first: a broken
      # checker should still leave a usable artifact behind.
      - name: Fail if the checker itself is broken
        if: steps.check.outputs.code == '1'
        env:
          # Piped through env rather than interpolated directly into the
          # script, so this is data to the shell rather than template
          # expansion into it -- harmless here (the value is one digit this
          # job's own prior step produced), but that is the general shape to
          # keep even when it happens not to matter.
          CHECK_CODE: ${{ steps.check.outputs.code }}
        run: |
          echo "::error::check-published.sh exited ${CHECK_CODE} -- see the Check step above"
          exit 1

      # --- issue maintenance ----------------------------------------------
      - name: Open or update the tracking issue
        if: steps.check.outputs.issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: Published images failed the post-publish audit
          MARKER: '<!-- published-audit: tracking issue -->'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The default shell is `bash -e` without pipefail: a failed lookup
          # piped into jq would otherwise read as "no issue yet" and open a
          # duplicate.
          set -o pipefail
          {
            # First, so it survives however the rest of the body changes;
            # it is how the next run recognises this issue (see below).
            echo "$MARKER"
            echo "One or more images published to ghcr.io/${{ github.repository_owner }} did not pass"
            echo "the post-publish audit: pullable, public (pullable with no credentials), correctly"
            echo "signed, carrying both SBOM and"
            echo "provenance attestations, and no older than 10 days (rebuilt daily; the margin allows for a few failed rebuilds)."
            echo
            cat table.md
            echo
            echo "This checks the registry directly -- it is independent of, and runs after, every"
            echo "gate in build-image.yml. A finding here means what is actually live differs from"
            echo "what the last build believed it published."
            echo
            echo "This issue is maintained automatically: it is updated while a finding remains and"
            echo "closed once the audit is clean. Last checked: $RUN_URL"
          } > body.md

          # Idempotent by construction, same as pin-drift.yml: find the
          # existing open issue and edit it, so a scheduled run updates one
          # issue rather than opening a new one every time.
          #
          # "The existing issue" is one THIS WORKFLOW opened, not merely one
          # with the same title: anyone with a GitHub account can open an
          # issue here, and matching on the title alone would let them pick
          # the issue the bot then keeps updating and closing -- or one whose
          # body they can rewrite, around the bot's findings. So an issue
          # counts only when GitHub records its author as github-actions[bot]
          # (a Bot account, which no person can sign in as; `.user.type` rules
          # out a look-alike login) AND its body carries the marker above,
          # which only the bot and the repository's own maintainers can write
          # into a bot's issue. The marker also tells this issue apart from
          # any other the bot opens with GITHUB_TOKEN. The REST API is read
          # directly, rather than `gh issue list --json author`, because it
          # states the login and the account type exactly; pull requests come
          # back from the same endpoint and are dropped. Every page is read:
          # the old `--limit 100` would have missed the issue in a busy
          # tracker and opened a second one.
          existing=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            | jq -rs --arg t "$TITLE" --arg m "$MARKER" '
                add // []
                | map(select(.pull_request == null
                             and .user.login == "github-actions[bot]" and .user.type == "Bot"
                             and .title == $t and ((.body // "") | contains($m))))
                | .[0].number // empty')

          if [ -n "$existing" ]; then
            echo "updating existing issue #$existing"
            gh issue edit "$existing" --body-file body.md
          else
            echo "opening a new tracking issue"
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Close the tracking issue when the audit is clean
        if: steps.check.outputs.issues == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: Published images failed the post-publish audit
          MARKER: '<!-- published-audit: tracking issue -->'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # The same lookup as the step above: only the bot's own issue,
          # by author and marker, never one that merely has the title.
          existing=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            | jq -rs --arg t "$TITLE" --arg m "$MARKER" '
                add // []
                | map(select(.pull_request == null
                             and .user.login == "github-actions[bot]" and .user.type == "Bot"
                             and .title == $t and ((.body // "") | contains($m))))
                | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "closing #$existing -- every published image passed"
            gh issue close "$existing" --comment "The post-publish audit is clean. Verified by $RUN_URL"
          else
            echo "no open audit issue and no findings; nothing to do"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-audit-report
          path: report.json
          if-no-files-found: warn
          retention-days: 90
