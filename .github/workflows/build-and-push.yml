# Builds, tests, scans and publishes every image in .github/images.json.
#
# The per-image pipeline lives in build-image.yml (a reusable workflow); this
# file decides WHICH images run and feeds each one its four values. Adding an
# image no longer touches this file: create the ci-<name>/ directory, add one
# entry to images.json and one to dependabot.yml.
#
# Which images run:
#   - push / pull_request  -> only the images whose directories changed, unless
#     the pipeline itself (this file, build-image.yml, images.json) changed, in
#     which case everything runs. A one-line fix to ci-ruby34 no longer
#     rebuilds nine images and moves `latest` on all of them.
#   - schedule / dispatch  -> everything, always. The weekly rebuild is the
#     security-update mechanism and must never be narrowed.
#
# All actions are pinned by commit SHA with the version in a trailing comment;
# Dependabot maintains the pins, and zizmor's default hash-pin policy enforces
# the practice.
name: Build and Push to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'ci-*/**'
      - '.github/workflows/build-and-push.yml'
      - '.github/workflows/build-image.yml'
      - '.github/images.json'
  # PRs run the full lint -> build -> smoke test -> scan pipeline, but every
  # step that writes to the registry is skipped: PR builds use the upstream
  # base instead of the mirror, and nothing is pushed or tagged. A green PR run
  # is the pre-merge proof; publishing happens only on main.
  pull_request:
    branches: [main]
    paths:
      - 'ci-*/**'
      - '.github/workflows/build-and-push.yml'
      - '.github/workflows/build-image.yml'
      - '.github/images.json'
  schedule:
    # Weekly rebuild: re-mirrors the upstream bases, picks up security updates,
    # and re-runs the vulnerability scan.
    #
    # GitHub disables scheduled workflows after 60 days without repository
    # activity, and does so silently -- the rebuild just stops and the image goes
    # stale. If the last run is old, trigger this workflow manually to re-enable.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides which images this run covers. Emits a JSON array of
  # {image, version, mirror, upstream} objects -- a subset of images.json for
  # change-triggered runs, the full list otherwise. Every ambiguous case falls
  # back to the full list: over-building is a cost, under-building is a stale
  # published image nobody notices.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the diff below compares against a commit that a
          # shallow clone may not have.
          fetch-depth: 0
          persist-credentials: false

      - name: Select images
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=$(jq -c . .github/images.json)

          select_all() {
            echo "images=$full" >> "$GITHUB_OUTPUT"
            echo "### Plan: all images ($1)" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[].image' <<<"$full" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          case "$EVENT" in
            schedule|workflow_dispatch) select_all "$EVENT is always a full rebuild" ;;
          esac

          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...HEAD"
          else
            # A force-push or branch creation has no usable before-SHA.
            case "$BEFORE" in ''|0000000000000000000000000000000000000000)
              select_all "push with no before-SHA" ;;
            esac
            range="$BEFORE..HEAD"
          fi

          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then
            select_all "diff against $range failed"
          fi

          # A change to the pipeline itself invalidates every image.
          if grep -qE '^\.github/(workflows/(build-and-push|build-image)\.yml|images\.json)$' <<<"$changed"; then
            select_all "pipeline definition changed"
          fi

          dirs=$(grep -oE '^ci-[^/]+' <<<"$changed" | sort -u) || true
          subset=$(jq -c --arg dirs "$dirs" \
            '[.[] | select(.image as $i | $dirs | split("\n") | index($i))]' \
            .github/images.json)

          if [ "$(jq 'length' <<<"$subset")" -eq 0 ]; then
            select_all "no image directory in the diff (defensive fallback)"
          fi

          echo "images=$subset" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan: changed images only"
            jq -r '.[].image' <<<"$subset" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  # Cheap fail-fast layer: a typo'd Dockerfile, workflow, or test script never
  # spends runner minutes on multi-arch image builds.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DL3008 (pin apt versions) is ignored inline in each Dockerfile: the
      # weekly rebuild is the update mechanism, so apt pins would go stale and
      # break builds without making anything more reproducible.
      - name: hadolint (Dockerfiles)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          recursive: true
          dockerfile: '*/Dockerfile.ci'
          failure-threshold: warning

      - name: actionlint (workflows)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: shellcheck (test scripts)
        run: shellcheck ./*/test.sh

      # images.json is executable configuration -- a malformed entry fails here,
      # before any build minutes are spent on it.
      - name: Validate images.json
        run: |
          jq -e 'type == "array" and length > 0 and
                 all(.[]; (.image | test("^ci-[a-z0-9]+$")) and
                          (.version | length > 0) and
                          (.mirror | length > 0) and
                          (.upstream | length > 0))' \
            .github/images.json >/dev/null
          # Every entry must have a directory, and every ci-* directory an entry.
          for img in $(jq -r '.[].image' .github/images.json); do
            test -f "$img/Dockerfile.ci" || { echo "::error::$img in images.json but $img/Dockerfile.ci missing"; exit 1; }
            test -x "$img/test.sh"       || { echo "::error::$img/test.sh missing or not executable"; exit 1; }
          done
          for d in ci-*/; do
            jq -e --arg i "${d%/}" 'any(.[]; .image == $i)' .github/images.json >/dev/null \
              || { echo "::error::directory $d has no images.json entry"; exit 1; }
          done

  # Copy the upstream bases into ghcr.io so builds do not depend on upstream
  # registry availability or rate limits, and so we control the digest we build
  # from. `imagetools create` copies registry-to-registry and preserves the
  # multi-arch manifest list; docker pull/tag/push would flatten it to one
  # architecture.
  #
  # Skipped for every non-publishing run: PRs and manual runs from non-main
  # branches use the upstream base directly, so validation cannot mutate
  # registry state and a brand-new image's first PR needs no existing mirror.
  # Mirrors only the images this run builds.
  mirror:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Mirror upstream bases
        env:
          IMAGES_JSON: ${{ needs.plan.outputs.images }}
          OWNER: ${{ github.repository_owner }}
        run: |
          jq -r '.[] | .upstream + " " + .mirror' <<<"$IMAGES_JSON" \
          | while read -r upstream mirror; do
              echo "::group::mirror $upstream -> $mirror"
              docker buildx imagetools create \
                --tag "ghcr.io/$OWNER/$mirror" \
                "$upstream"
              echo "::endgroup::"
            done

  # One reusable-workflow call per selected image. Each call fans out into a
  # per-architecture build matrix plus a merge job -- see build-image.yml.
  image:
    needs: [plan, lint, mirror]
    # `mirror` is skipped on PRs; run when plan and lint passed and mirror
    # either passed or was skipped, but never after a failure or cancellation.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success' && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    name: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      security-events: write
      # For the merge job's keyless cosign signing -- the called workflow's
      # permissions are intersected with this grant.
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      version: ${{ matrix.version }}
      mirror: ${{ matrix.mirror }}
      upstream: ${{ matrix.upstream }}

  # Aggregates the per-image digest manifests into one machine-readable
  # digests.json, so consumers can automate digest pinning instead of copying
  # digests out of run summaries by hand. Publish runs only -- PR runs skip the
  # merge jobs, so there is nothing to aggregate. Covers whatever subset this
  # run built; a full-rebuild run yields the complete set.
  digests:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download digest manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: manifests
          pattern: digest-manifest-*
          merge-multiple: true

      - name: Assemble digests.json
        run: |
          jq -s 'sort_by(.image)' manifests/digest-manifest-*.json > digests.json
          jq . digests.json
          {
            echo "### Published digests (this run)"
            echo
            echo "| image | version | digest |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.image) | \(.version) | `\(.digest)` |"' digests.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digests.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests
          path: digests.json
          if-no-files-found: error
          retention-days: 90
