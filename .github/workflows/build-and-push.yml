# Builds, tests, scans and publishes every image in .github/images.json.
#
# The per-image pipeline lives in build-image.yml (a reusable workflow); this
# file decides WHICH images run and feeds each one its four values. Adding an
# image no longer touches this file: create the ci-<name>/ directory, add one
# entry to images.json and one to dependabot.yml.
#
# Which images run:
#   - push / pull_request  -> only the images whose directories changed, unless
#     the pipeline itself (this file, build-image.yml, images.json, or the two
#     scripts build-image.yml runs) changed, in which case everything runs. A
#     one-line fix to ci-ruby34 no longer rebuilds every image and moves
#     `latest` on all of them.
#   - schedule / dispatch  -> everything, always. The weekly rebuild is the
#     security-update mechanism and must never be narrowed.
#
# All actions are pinned by commit SHA with the version in a trailing comment;
# Dependabot maintains the pins, and zizmor's default hash-pin policy enforces
# the practice.
name: Build and Push to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'ci-*/**'
      - '.github/workflows/build-and-push.yml'
      - '.github/workflows/build-image.yml'
      - '.github/images.json'
      - 'scripts/check-published.sh'
      - 'scripts/osv-scan-sbom.sh'
  # PRs run the full lint -> build -> smoke test -> scan pipeline, but every
  # step that writes to the registry is skipped: PR builds use the upstream
  # base instead of the mirror, and nothing is pushed or tagged. A green PR run
  # is the pre-merge proof; publishing happens only on main.
  pull_request:
    branches: [main]
    paths:
      - 'ci-*/**'
      - '.github/workflows/build-and-push.yml'
      - '.github/workflows/build-image.yml'
      - '.github/images.json'
      - 'scripts/check-published.sh'
      - 'scripts/osv-scan-sbom.sh'
  schedule:
    # Weekly rebuild: re-mirrors the upstream bases, picks up security updates,
    # and re-runs the vulnerability scan.
    #
    # GitHub disables scheduled workflows after 60 days without repository
    # activity, and does so silently -- the rebuild just stops and the image goes
    # stale. If the last run is old, trigger this workflow manually to re-enable.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default-deny. Every job below sets the permissions it actually needs, and a
# job-level block overrides this one -- so this changes nothing for the jobs
# that exist today. It is here for the job that does not exist yet: without it,
# a new job added without a permissions block silently inherits the repository
# default, which can be read-write on everything. With it, forgetting the block
# means the job gets no token scopes and fails loudly instead of running
# over-privileged.
permissions: {}

jobs:
  # Decides which images this run covers. Emits a JSON array of
  # {image, version, mirror, upstream} objects -- a subset of images.json for
  # change-triggered runs, the full list otherwise. Every ambiguous case falls
  # back to the full list: over-building is a cost, under-building is a stale
  # published image nobody notices.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the diff below compares against a commit that a
          # shallow clone may not have.
          fetch-depth: 0
          persist-credentials: false

      - name: Select images
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=$(jq -c . .github/images.json)

          select_all() {
            echo "images=$full" >> "$GITHUB_OUTPUT"
            echo "### Plan: all images ($1)" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[].image' <<<"$full" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          case "$EVENT" in
            schedule|workflow_dispatch) select_all "$EVENT is always a full rebuild" ;;
          esac

          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...HEAD"
          else
            # A force-push or branch creation has no usable before-SHA.
            case "$BEFORE" in ''|0000000000000000000000000000000000000000)
              select_all "push with no before-SHA" ;;
            esac
            range="$BEFORE..HEAD"
          fi

          if ! changed=$(git diff --name-only "$range" 2>/dev/null); then
            select_all "diff against $range failed"
          fi

          # A change to the pipeline itself invalidates every image. The two
          # scripts count as pipeline: build-image.yml runs them on every image.
          if grep -qE '^(\.github/(workflows/(build-and-push|build-image)\.yml|images\.json)|scripts/(check-published|osv-scan-sbom)\.sh)$' <<<"$changed"; then
            select_all "pipeline definition changed"
          fi

          dirs=$(grep -oE '^ci-[^/]+' <<<"$changed" | sort -u) || true
          subset=$(jq -c --arg dirs "$dirs" \
            '[.[] | select(.image as $i | $dirs | split("\n") | index($i))]' \
            .github/images.json)

          if [ "$(jq 'length' <<<"$subset")" -eq 0 ]; then
            select_all "no image directory in the diff (defensive fallback)"
          fi

          echo "images=$subset" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan: changed images only"
            jq -r '.[].image' <<<"$subset" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  # Cheap fail-fast layer: a typo'd Dockerfile, workflow, or test script never
  # spends runner minutes on multi-arch image builds.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One engine, not two. This job used to run hadolint and actionlint via
      # their marketplace actions while scripts/lint.sh ran its own pinned,
      # checksum-verified copies -- so `make lint` and CI could disagree, and
      # the only thing keeping them honest was a human remembering to move two
      # numbers together.
      #
      # That failed twice, both times as a Dependabot PR bumping
      # hadolint-action alone: the action bundles a hadolint binary, so the bump
      # silently put local on one linter and CI on another, and CI passed
      # because nothing in this job ever read lint.sh. actionlint had the same
      # shape and nobody had noticed, because raven-actions/actionlint picks its
      # own binary version independently of ACTIONLINT_VERSION.
      #
      # Running the script instead makes agreement structural: there is one
      # pinned version of each engine, in one file, and local-clean now means
      # CI-lint-clean by construction rather than by convention.
      #
      # It also closes two gaps this job had. The inline jq validation below was
      # a verbatim copy of the cross-check already in lint.sh -- two copies of
      # the same forty lines, either of which could drift from the other. And
      # `shellcheck ./*/test.sh` never covered scripts/ at all, so the repo's own
      # tooling, including the drift checker that decides which pins get bumped,
      # was linted locally and not in CI.
      #
      # The cost is inline PR annotations: the marketplace actions emitted them,
      # a plain `run:` step does not. Findings appear in the job log with file
      # and line instead. That is the price of one engine, and it is worth it.
      #
      # shellcheck comes from the runner image. If that ever stops being true
      # the script exits 2 with a message naming it, rather than skipping.
      # zizmor is best-effort inside the script and will skip here for want of
      # uv -- security.yml runs it properly, with SARIF, as its own job.
      - name: Lint
        run: ./scripts/lint.sh

  mirror:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Every other mutable reference in this pipeline gets an integrity check:
      # actions are pinned by SHA, downloaded binaries are checksum-verified,
      # lint engines are pinned and hashed. The one mutable reference that
      # gets none of that is the base image itself -- `docker
      # buildx imagetools create --tag mirror "$upstream"` asks the registry to
      # resolve a floating tag and copies whatever it hands back, with no record
      # of which bytes crossed. If Docker Hub ever served a compromised
      # `debian:bookworm-slim` during some window, this step would mirror it
      # faithfully, every image based on it would be built from it, and nothing
      # here could later answer "were we affected" -- the exact question the SBOMs
      # (README, "Security scanning") exist to answer for everything upstream
      # of this boundary.
      #
      # Resolve -> copy-by-digest -> verify closes that gap:
      #   1. Resolve the tag to a digest ONCE, before copying anything.
      #   2. Mirror that exact digest, not the tag a second time. Two separate
      #      tag resolutions (one here, one implicit inside a plain
      #      `imagetools create "$upstream"`) are two chances for the tag to
      #      move between them -- a real race, not a theoretical one, and the
      #      whole point of pinning by digest elsewhere in this repo.
      #   3. Verify the mirror resolves back to that same digest. A mirror that
      #      is not the bytes it claims to mirror is worse than no mirror: every
      #      image downstream would build on unverified content, silently. This
      #      gates the step, the same posture as the vulnerability and secret
      #      gates in build-image.yml.
      #   4. Record {upstream, tag, digest} for every distinct base, so "were we
      #      affected during window X" is answerable later instead of requiring
      #      a rebuild or a dig through registry history.
      #
      # This is deliberately scoped to the mirror boundary and NOT to the
      # Dockerfiles' `ARG BASE_IMAGE` defaults (python:3.13, node:22, golang:1,
      # ...). Those defaults are load-bearing exactly because they float: it is
      # how Dependabot proposes base bumps and how the weekly rebuild picks up
      # upstream security patches (see docs/adr/0001-mirror-upstream-bases.md).
      # Digest-pinning them would freeze security updates, not improve
      # integrity. The mirror is where bytes actually enter this pipeline from
      # the outside world; that is where an integrity control belongs, and
      # nowhere else in this repo should "fix" that default to a digest.
      - name: Mirror upstream bases
        # Explicit, not decorative: GitHub's fallback for a `run:` step with no
        # `shell:` is `bash -e {0}` -- errexit WITHOUT pipefail. Under that
        # shell, a failing `docker` inside `resolve_digest` is invisible to
        # its caller: the function's own exit status is `awk`'s (the last
        # command in its pipe), which is 0 even when docker failed. Setting
        # `shell: bash` here opts this step into `bash -eo pipefail {0}`
        # instead, so a failing `docker` (or a `jq` parse failure in the
        # producer pipeline below) actually propagates and errexit sees it,
        # rather than the step going green on empty output. See the `|| true`
        # comment below for what that buys once pipefail is on.
        shell: bash
        env:
          IMAGES_JSON: ${{ needs.plan.outputs.images }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # One authoritative resolution helper, reused for both the upstream
          # tag and the mirror after copying -- so "what digest does this ref
          # resolve to" is asked the same way both times and cannot drift into
          # two subtly different parses of `imagetools inspect` output.
          #
          # Each call here is one more anonymous pull against whatever
          # registry it targets -- resolving upstream and verifying the
          # mirror both count. Against Docker Hub that's roughly double the
          # anonymous rate-limit exposure of a plain `imagetools create
          # "$upstream"`; if this step starts 429ing against Docker Hub,
          # that is why.
          resolve_digest() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2; exit}'
          }

          # sort -u because several images share one base: ci-tools, ci-cloud,
          # ci-security and ci-db all build FROM debian:bookworm-slim, and
          # without this the identical base would be resolved, copied and
          # verified once per image instead of once per distinct base, on every
          # publish run.
          : > /tmp/bases.jsonl

          jq -r '.[] | .upstream + " " + .mirror' <<<"$IMAGES_JSON" \
          | sort -u \
          | while read -r upstream mirror; do
              echo "::group::mirror $upstream -> $mirror"

              # `|| true` on the assignment: this step runs under `bash -eo
              # pipefail` (see `shell: bash` above), so a nonzero `docker`
              # inside `resolve_digest` -- the realistic case for an
              # unreachable or unknown ref -- now DOES propagate through the
              # `| awk` pipe to this assignment. Without `|| true` that would
              # trip `errexit` right here, before the check below ever runs,
              # and this step would fail with only docker's own message
              # instead of the annotated one. `[ -z "$digest" ]` is what
              # actually gates: it also catches `resolve_digest` "succeeding"
              # with empty output, which a bare exit-code check would miss.
              digest=$(resolve_digest "$upstream" || true)
              if [ -z "$digest" ]; then
                echo "::error::failed to resolve a digest for $upstream"
                exit 1
              fi
              echo "resolved $upstream -> $digest"

              # `imagetools create` accepts `name:tag@digest` directly, with
              # the digest authoritative over the tag -- verified live: a
              # tag plus a differing per-platform digest resolves to what the
              # digest names, not what the tag points at. No need to split
              # the registry/repo out of "$upstream" first, which sidesteps
              # a latent bug that splitting would have: a registry with a
              # port (`registry:5000/foo:tag`) has more than one colon, and
              # `${upstream%%:*}` cuts at the first one.
              docker buildx imagetools create \
                --tag "ghcr.io/$OWNER/$mirror" \
                "$upstream@$digest"

              mirrored=$(resolve_digest "ghcr.io/$OWNER/$mirror" || true)
              if [ "$mirrored" != "$digest" ]; then
                echo "::error::ghcr.io/$OWNER/$mirror resolved to '$mirrored' after mirroring, expected '$digest' -- refusing to build on an unverified mirror"
                exit 1
              fi
              echo "verified ghcr.io/$OWNER/$mirror -> $digest"

              jq -n --arg upstream "$upstream" --arg tag "$mirror" --arg digest "$digest" \
                '{upstream: $upstream, tag: $tag, digest: $digest}' >> /tmp/bases.jsonl

              echo "::endgroup::"
            done

          # One {upstream, tag, digest} record per distinct base -- the
          # mirror-boundary counterpart to digests.json, which records the same
          # shape one layer further downstream (per published image, not per
          # base). A separate artifact rather than folding this into
          # digests.json: digests.json is assembled by the `digests` job from
          # every per-image build in the matrix, while every base is already
          # fully resolved and verified right here, inside this one job, before
          # the image matrix even starts. Extending digests.json would mean
          # threading base data through every matrix job, which it has nothing to
          # do with, just to re-merge it back down to the same handful of
          # distinct bases this loop already produced.
          jq -s 'sort_by(.upstream)' /tmp/bases.jsonl > bases.json

          # Guard against a silently empty result: an unparseable or empty
          # IMAGES_JSON makes `jq -r '.[] | ...'` above fail on stderr while
          # the pipeline it feeds (`| sort -u | while read ...`) still exits
          # 0 -- the loop just never runs. Nothing upstream of this step
          # would go red, and `bases.json` would come out as `[]`: a step
          # that reports success and a record that reports zero bases
          # actually verified. Not reachable today (the `plan` job always
          # falls back to building every image when it cannot compute a
          # subset), but this job's whole point is a trustworthy record, so
          # it asserts one instead of assuming it: every distinct
          # upstream/mirror pair named in IMAGES_JSON must have produced
          # exactly one bases.json entry, and there must be at least one.
          expected=$(jq -r '.[] | .upstream + " " + .mirror' <<<"$IMAGES_JSON" 2>/dev/null \
            | sort -u | wc -l | tr -d '[:space:]') || expected=0
          actual=$(jq 'length' bases.json)
          if [ "$actual" -eq 0 ] || [ "$actual" -ne "$expected" ]; then
            echo "::error::bases.json has $actual entries, expected $expected distinct upstream/mirror pairs from IMAGES_JSON -- refusing to publish a bases record that does not account for every base (IMAGES_JSON may have been empty or unparseable)"
            exit 1
          fi

          jq . bases.json
          {
            echo "### Mirrored bases (this run)"
            echo
            echo "Each base was resolved to a digest, mirrored by that digest (not by tag), and"
            echo "the mirror verified to resolve back to it."
            echo
            echo "| upstream | mirror tag | digest |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.upstream) | \(.tag) | `\(.digest)` |"' bases.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bases.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bases
          path: bases.json
          if-no-files-found: error
          retention-days: 90

  # One reusable-workflow call per selected image. Each call fans out into a
  # per-architecture build matrix plus a merge job -- see build-image.yml.
  image:
    needs: [plan, lint, mirror]
    # `mirror` is skipped on PRs; run when plan and lint passed and mirror
    # either passed or was skipped, but never after a failure or cancellation.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success' && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    name: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      security-events: write
      # For the merge job's keyless cosign signing -- the called workflow's
      # permissions are intersected with this grant.
      id-token: write
      # For the merge job's GitHub build provenance attestation, on the same
      # intersection rule.
      attestations: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      version: ${{ matrix.version }}
      mirror: ${{ matrix.mirror }}
      upstream: ${{ matrix.upstream }}

  # Aggregates the per-image digest manifests into one machine-readable
  # digests.json, so consumers can automate digest pinning instead of copying
  # digests out of run summaries by hand. Publish runs only -- PR runs skip the
  # merge jobs, so there is nothing to aggregate. Covers whatever subset this
  # run built; a full-rebuild run yields the complete set.
  #
  # Runs even when some `image` call failed (`!cancelled()`, not the implicit
  # success()). A failed image must not cost every OTHER image its entry: the
  # report-only OSV job failing, or one image's gate, used to skip this job
  # for the whole run. What gets aggregated is still only what was actually
  # published and verified -- the merge job uploads its manifest as its last
  # step, after signing, all three verifications, the attestation and the
  # both-platforms assertion, so an image that failed any of them has no
  # manifest here.
  # The run stays red either way; the summary says how many of the planned
  # images made it, so a partial set is visible rather than silent.
  digests:
    needs: [plan, image]
    if: ${{ !cancelled() && needs.image.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download digest manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: manifests
          pattern: digest-manifest-*
          merge-multiple: true

      - name: Assemble digests.json
        env:
          PLANNED_IMAGES: ${{ needs.plan.outputs.images }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          # nullglob: with no manifests at all, an unexpanded pattern would
          # reach jq as a literal filename and fail with a confusing error.
          shopt -s nullglob
          manifests=(manifests/digest-manifest-*.json)
          planned=$(jq 'length' <<<"$PLANNED_IMAGES")
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::no digest manifests to aggregate: 0 of $planned planned images were published and verified"
            exit 1
          fi

          jq -s 'sort_by(.image)' "${manifests[@]}" > digests.json
          jq . digests.json
          aggregated=$(jq 'length' digests.json)
          missing=$(jq -rn --argjson planned "$PLANNED_IMAGES" --slurpfile got digests.json \
            '[$planned[].image] - [$got[0][].image] | join(", ")')

          {
            echo "### Published digests (this run)"
            echo
            echo "Aggregated **$aggregated of $planned** planned images (image jobs: $IMAGE_RESULT)."
            if [ -n "$missing" ]; then
              echo
              echo "Not in digests.json -- not published, or failed post-sign verification: $missing"
            fi
            echo
            echo "| image | version | digest |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.image) | \(.version) | `\(.digest)` |"' digests.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            echo "::warning::digests.json covers $aggregated of $planned planned images; missing: $missing"
          fi

      - name: Upload digests.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests
          path: digests.json
          if-no-files-found: error
          retention-days: 90
