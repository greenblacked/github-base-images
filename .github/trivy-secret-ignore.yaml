# The image secret gate's exceptions: known, published test and documentation
# fixtures that upstream software ships inside the images, each one a
# (Trivy rule ID, exact path) pair. build-image.yml's "Secret gate" step
# passes this file to Trivy as its ignore file (trivyignores); the "Secret
# report" step does not, so every one of these is still listed, in full, in
# the security-report-<image>-<arch> artifact of every build -- the same split
# as the vulnerability exceptions (.github/vuln-exceptions.json).
#
# Why this file exists: .github/trivy-secret.yaml switches off Trivy's
# built-in allow rules, so the gate now reads test, example, vendored and
# system-library paths it used to skip. These are what it found there. None
# of them is a credential: each is a key or token that was generated to be
# published -- in a test suite or a documentation example -- and is already
# public in the upstream project's repository and release.
#
# Rules for an entry, checked by scripts/lint.sh:
#   - `id` is the Trivy secret rule ID that fires (private-key,
#     gcp-service-account, jwt-token, ...). The entry excuses that rule ONLY:
#     any other rule firing on the same file still fails the gate.
#   - every path is one file, written as Trivy reports it in an image scan
#     (with the leading "/"). `*` stands only for a version-numbered path
#     segment (the AWS CLI's install directory, a Python minor version, a
#     package's .dist-info), so a version bump does not turn the gate red on
#     a fixture already reviewed here; `**` and any other glob are not
#     allowed. A fixture at a new path fails the gate until it is reviewed and
#     added.
#   - a `statement` says what the file is and why its match is not a
#     credential; the comment above the entry says which image carries it.
#
# Prefer removing a fixture in the Dockerfile when nothing in a CI image could
# need it -- ci-cloud already deletes urllib3's dummyserver keys from gsutil
# that way (see ci-cloud/Dockerfile.ci) -- and list it here only when deleting
# it would mean editing an upstream toolchain or package in place.
secrets:
  # ci-go: the Go toolchain's own standard-library sources under GOROOT
  # (golang:1-bookworm). Deleting files from GOROOT/src would break `go test
  # std` in the image.
  - id: private-key
    paths:
      - "/usr/local/go/src/crypto/tls/example_test.go"
      - "/usr/local/go/src/crypto/tls/testdata/example-key.pem"
      - "/usr/local/go/src/crypto/x509/platform_root_key.pem"
    statement: "Go standard library test fixtures: the throwaway RSA/ECDSA keys in crypto/tls's runnable examples and testdata, and crypto/x509's platform-verifier test key. Public in the Go source tree."

  # ci-tools: the AWS CLI v2's help examples (`aws <command> help` renders
  # these .rst files). The key IDs in the same directory are excused by the
  # content allow rule in .github/trivy-secret.yaml; these four print a
  # sample (truncated or placeholder) private key in a response body.
  - id: private-key
    paths:
      - "/usr/local/aws-cli/v2/*/dist/awscli/examples/iot/create-keys-and-certificate.rst"
      - "/usr/local/aws-cli/v2/*/dist/awscli/examples/iot/create-provisioning-claim.rst"
      - "/usr/local/aws-cli/v2/*/dist/awscli/examples/lightsail/create-key-pair.rst"
      - "/usr/local/aws-cli/v2/*/dist/awscli/examples/lightsail/get-instance-access-details.rst"
    statement: "AWS CLI documentation examples: sample command output with placeholder private keys (some literally 'EXAMPLE...' or 'key omitted'). Public in aws/aws-cli."

  # ci-cloud: the test suites the Google Cloud CLI vendors inside gsutil --
  # google-auth-library-python's, requests's, gsutil's own and its vendored
  # boto's. Left in place rather than deleted like urllib3's dummyserver:
  # gslib/tests is what `gsutil test` runs, and the rest sit inside the
  # vendored packages gsutil imports, so deleting them would be an untested
  # change to gsutil itself.
  - id: private-key
    paths:
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/es256_privatekey.pem"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/es256_service_account.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/gdch_service_account.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/impersonated_service_account_service_account_source.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/pem_from_pkcs12.pem"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/privatekey.pem"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/service_account.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/service_account_non_gdu.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/transport/test__mtls_helper.py"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/requests/tests/certs/expired/ca/ca-private.key"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/requests/tests/certs/expired/server/server.key"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/requests/tests/certs/mtls/client/client.key"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/requests/tests/certs/valid/server/server.key"
      - "/opt/google-cloud-sdk/platform/gsutil/gslib/tests/test_data/test.json"
      - "/opt/google-cloud-sdk/platform/gsutil/gslib/vendored/boto/tests/unit/cloudfront/test_signed_urls.py"
    statement: "Test fixtures vendored by gsutil in the Google Cloud CLI: keys generated for google-auth's, requests's, gsutil's and boto's own unit tests (test CAs, test servers, fake service accounts). Public in googleapis/google-auth-library-python, psf/requests, GoogleCloudPlatform/gsutil and boto/boto."
  - id: gcp-service-account
    paths:
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/es256_service_account.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/impersonated_service_account_service_account_source.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/service_account.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/data/service_account_non_gdu.json"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests/test__default.py"
      - "/opt/google-cloud-sdk/platform/gsutil/third_party/google-auth-library-python/tests_async/test__default_async.py"
      - "/opt/google-cloud-sdk/platform/gsutil/gslib/tests/test_data/test.json"
    statement: "Fake service-account key files (\"type\": \"service_account\") used by google-auth's and gsutil's unit tests, for projects and accounts that do not exist. Public upstream."

  # ci-cloud: the Azure CLI's private Python (/opt/az), PyJWT's package
  # metadata. METADATA is what pip reads to know PyJWT is installed, so it
  # cannot be removed; `*` stands for the Python minor version and the PyJWT
  # version pinned in ci-cloud/az-overrides.txt.
  - id: jwt-token
    paths:
      - "/opt/az/lib/python3.*/site-packages/pyjwt-*.dist-info/METADATA"
    statement: "PyJWT's README, copied into its package METADATA: the example token jwt.encode({'some': 'payload'}, 'secret') from the usage section. Public on PyPI."
