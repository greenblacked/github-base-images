# Trivy secret-scanner configuration for every secret scan in this
# repository: the image secret gate and secret report in build-image.yml, and
# the repository secret scan in security.yml. Each of those steps points
# TRIVY_SECRET_CONFIG here.
#
# What it changes: Trivy's built-in ALLOW rules are switched off, so the
# scanner reads the files they would have skipped unread. Trivy's built-in
# DETECTION rules are untouched (no enable-builtin-rules, no disable-rules):
# everything Trivy looks for, it still looks for, now everywhere.
#
# Written for this Trivy release (the one the pinned
# aquasecurity/trivy-action installs by default, its `version` input). The
# secret gate checks the running Trivy against this line and fails on any
# other version, because a new release can add an allow rule this list does
# not name -- which would silently stop the gate reading those paths again.
# Dependabot bumping trivy-action to one that installs a newer Trivy is
# therefore red until someone does this: compare
# pkg/fanal/secret/builtin-allow-rules.go at the new tag with the list below,
# update the list, its copy in scripts/lint.sh (section 17) and this line.
# trivy-version: 0.70.0
#
# disable-allow-rules lists EVERY ID in that file at v0.70.0
# (https://github.com/aquasecurity/trivy/blob/v0.70.0/pkg/fanal/secret/builtin-allow-rules.go).
# Each skipped any file whose path matched, without reading it:
disable-allow-rules:
  - dist-info      # \.dist-info/            Python package metadata
  - tests          # ^test, /test, -test, _test, .test anywhere in the path
  - examples       # `example` anywhere in the path -- and also any MATCH
                   # containing "example", case-insensitively
  - vendor         # /vendor/
  - usr-dirs       # ^usr/(share|include|lib)/ -- Debian's dist-packages, gems, docs
  - locale-dir     # /locale/ or /locales/
  - markdown       # \.md$
  - node.js        # ^opt/yarn-v<version>/
  - golang         # ^usr/local/go/
  - python         # ^usr/local/lib/python<version>/ -- every pip site-packages
  - rubygems       # ^usr/lib/gems/
  - wordpress      # ^usr/src/wordpress/
  - anaconda-log   # ^var/log/anaconda/
#
# What this cannot switch on. Trivy's secret analyzer has its own fixed skip
# list in code, not in allow rules, so no configuration reaches it
# (pkg/fanal/analyzer/secret/secret.go at v0.70.0): any path under a
# `node_modules` or `.git` directory; files named go.mod, go.sum,
# package-lock.json, yarn.lock, pnpm-lock.yaml, Pipfile.lock or Gemfile.lock;
# the extensions .jpg .png .gif .doc .pdf .bin .svg .socket .deb .rpm .zip
# .gz .gzip .tar; binary files other than Python .pyc; files under 10 bytes.
# docs/security.md says the same to readers of the images.
#
# Content allow rules. A rule with only a `regex` excuses a match whose text
# matches it, in any file; a rule with a `path` would skip the whole file for
# every detection rule, so there are none here -- a file fixture is excused
# by (rule ID, exact path) in .github/trivy-secret-ignore.yaml instead, and
# only in the gate. Custom IDs must not reuse a built-in allow-rule ID above,
# or the list above would disable them too.
allow-rules:
  # AWS's own documentation placeholder access key IDs, as printed in the AWS
  # CLI's `aws <command> help` examples (ci-tools:
  # /usr/local/aws-cli/v2/<version>/dist/awscli/examples/**/*.rst, about fifty
  # matches over some forty files) and in boto3's examples and
  # google-auth-library-python's tests vendored by the Google Cloud CLI
  # (ci-cloud). Each is a fixed, published string -- the access key IDs AWS
  # documents as examples, ending in the literal EXAMPLE -- never issued to
  # anyone, and matched whole, so a real key ID cannot be excused by sharing
  # a prefix. The built-in `examples` allow rule (disabled above) used to
  # excuse these by the word "example" in the match; this names each one.
  # A new placeholder fails the gate until it is reviewed and added here.
  - id: aws-documentation-example-key-ids
    description: AWS documentation placeholder access key IDs (AWS CLI help examples)
    regex: '(?:AKIAIOSFODNN7EXAMPLE|AKIAI44QH8DHBEXAMPLE|AIDAIOSFODNN7EXAMPLE|AIDA123456789EXAMPLE|ASIAIOSFODNN7EXAMPLE|ASIASZ4SI7REEEXAMPLE)'
