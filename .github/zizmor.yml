# zizmor configuration -- see .github/workflows/security.yml
#
# unpinned-uses: zizmor's default blanket policy is `hash-pin`, i.e. every
# `uses:` must reference a commit SHA. This repo currently pins by tag, so that
# default produced 136 high-severity findings in one go -- enough noise to bury
# the findings that actually need acting on, which is how a security check stops
# being read at all.
#
# `ref-pin` is the honest description of the current standard: a `uses:` must
# name a tag or SHA, never a mutable branch. It still fails on `@main`-style
# refs, which are the genuinely dangerous case.
#
# Hash-pinning remains the goal, and is the right end state for a repo whose
# whole purpose is producing trusted base images -- it is tracked as its own
# piece of work rather than suppressed. When it lands, delete this block so the
# stricter default applies again.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
