version: 2

# Every entry sets the same `cooldown`: do not adopt a version the day it is
# published. If an upstream release is ever compromised, the window between
# publication and discovery is exactly when a same-day bump would pull it in.
#
# `default-days` is the only cooldown key valid here -- the `semver-*-days`
# variants are rejected for both the docker and github-actions ecosystems,
# since neither resolves versions as semver (docker reads a tag, actions read
# a ref).
#
# This delays security fixes by the same amount, which is the real trade-off.
# It is acceptable here because the weekly rebuild plus the Trivy gate already
# catch a vulnerable Debian package without waiting for a base-image bump.

updates:
  # Keeps the action pins in .github/workflows current (docker/*, actions/*,
  # aquasecurity/trivy-action, hadolint, actionlint, zizmor's runner, scorecard).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Base image bumps arrive as PRs. Dependabot reads the default of the
  # `ARG BASE_IMAGE` each Dockerfile builds FROM, which is why that default
  # stays pointed at the real upstream ref rather than the mirror.
  #
  # Note this does NOT track the pinned tool versions in ci-tools/Dockerfile.ci
  # (Terraform, kubectl, AWS CLI, Docker client) -- those are plain ARGs with no
  # ecosystem behind them, so they move when a human moves them.
  - package-ecosystem: docker
    directory: /ci-node22
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /ci-python313
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /ci-go125
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /ci-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /ci-rust185
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /ci-ruby34
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /ci-java21
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Does not track COMPOSER_VERSION -- that is a plain ARG, like the ci-tools pins.
  - package-ecosystem: docker
    directory: /ci-php84
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Base lives on mcr.microsoft.com; Dependabot handles non-Hub registries.
  - package-ecosystem: docker
    directory: /ci-dotnet9
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
