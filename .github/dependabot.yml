version: 2

# Every entry is checked daily (docs/adr/0008-self-updating.md) and sets the
# same `cooldown`: do not adopt a version the day it is published. If an
# upstream release is ever compromised, the window between publication and
# discovery is exactly when a same-day bump would pull it in. Daily checking
# does not shorten that: a version still waits seven days, it is just picked
# up on the day it clears them rather than up to a week later.
#
# `default-days` is the only cooldown key valid here -- the `semver-*-days`
# variants are rejected for both the docker and github-actions ecosystems,
# since neither resolves versions as semver (docker reads a tag, actions read
# a ref).
#
# This delays security fixes by the same amount, which is the real trade-off.
# It is acceptable here because the daily rebuild plus the Trivy gate already
# catch a vulnerable Debian package without waiting for a base-image bump.
#
# Every update -- majors included -- merges itself once all four required
# checks are green on its head commit, via .github/workflows/merge-bot-prs.yml.
# A `hold` label stops one. Majors are labelled needs-review as information
# (.github/workflows/dependabot-auto-merge.yml).
#
# Docker entries: an update must never change WHAT an image is. Each image
# directory is one runtime line on one distribution -- ci-python313 is Python
# 3.13 on Bookworm, its tag says `bookworm-v1`, and consumers chose it for
# that. Dependabot reads the `ARG BASE_IMAGE` default as a version plus a
# suffix (`3.13` + `-slim-bookworm`) and would happily propose `3.14`, a
# different image under the same name. So every docker entry ignores
# semver-major and semver-minor updates: on these tags those are exactly the
# runtime line (python 3.13 -> 3.14 is a "minor", node 22 -> 24 a "major",
# ruby 3.4 -> 4.0 either). The distribution is in the suffix, which Dependabot
# keeps fixed, so a codename change is never proposed at all. What stays
# allowed is patch-level movement within the line and digest updates, if a
# digest is ever pinned; the daily rebuild already re-resolves the floating
# tag, which is how these images actually move. `dependency-name: "*"` because
# each directory has exactly one FROM, and Dependabot names registry images
# (mcr.microsoft.com/dotnet/sdk) in a way not worth depending on here.
# A new runtime line is a new image directory (CONTRIBUTING.md), never a bump.

updates:
  # Keeps the action pins in .github/workflows current (docker/*, actions/*,
  # aquasecurity/trivy-action, astral-sh/setup-uv, scorecard, and
  # dependabot/fetch-metadata in dependabot-auto-merge.yml). hadolint and
  # actionlint are no longer actions here: scripts/lint.sh pins both, and
  # scripts/check-pins.sh and bump-pins.sh keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # github/codeql-action is ONE action with three subpaths -- init, analyze
    # and upload-sarif -- pinned to one SHA in six places. Dependabot treats
    # each subpath as its own dependency, so without this it opens three PRs
    # per release, each moving only its own lines.
    #
    # That is not merely noisy, it is broken: CodeQL rejects a setup where init
    # and analyze are on different versions, so two of the three fail CI with
    # "CodeQL job status was configuration error" and the third passes while
    # being a third of a change. It has happened twice here (#32/#33/#34, and
    # the round before it), costing six PRs that all had to be closed and
    # replaced by a hand-assembled one (#36, #37).
    #
    # Grouping makes Dependabot open a single PR moving all six pins together,
    # which is the only arrangement that works.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Base image bumps arrive as PRs. Dependabot reads the default of the
  # `ARG BASE_IMAGE` each Dockerfile builds FROM, which is why that default
  # stays pointed at the real upstream ref rather than the mirror.
  #
  # Note this does NOT track the pinned tool versions in ci-tools/Dockerfile.ci
  # (Terraform, kubectl, AWS CLI, Docker client) -- those are plain ARGs with no
  # ecosystem behind them. .github/workflows/pin-bump.yml moves them instead.
  # node:22-bookworm-slim: the version is `22`, so node 24 would be a
  # semver-major, and that is all a one-number tag can be compared with. So
  # this entry is not expected to propose anything; the floating tag moves to
  # each Node 22 release with the daily rebuild. Same for ci-node24.
  - package-ecosystem: docker
    directory: /ci-node22
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # python:3.13-slim-bookworm: 3.14 would be a semver-minor, so minors are
  # ignored along with majors. Same for ci-python312 and ci-python314.
  - package-ecosystem: docker
    directory: /ci-python313
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # golang:1-bookworm (and rust:1-bookworm below): `1` IS the line -- these
  # two images track current stable on purpose (docs/images.md, "Go and
  # Rust"), and the floating tag already moves to each new toolchain minor.
  # Only a Go 2 / Rust 2 would be a version update here, and that is a new
  # image, not a bump.
  - package-ecosystem: docker
    directory: /ci-go
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # debian:bookworm-slim (ci-tools, ci-cloud, ci-security, ci-db): no version
  # number at all, only a codename, which Dependabot does not read as one, so
  # it never proposes trixie here. The ignore is there so that stays true
  # if it ever starts to.
  - package-ecosystem: docker
    directory: /ci-tools
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /ci-rust
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ruby:3.4-slim-bookworm: 3.5 would be a minor, 4.0 a major; both ignored.
  # Same for ci-ruby40, and for php 8.4 -> 8.5 in ci-php84.
  - package-ecosystem: docker
    directory: /ci-ruby34
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # eclipse-temurin:21-jdk-noble: 25 would be a major. Same for 17 and 25.
  - package-ecosystem: docker
    directory: /ci-java21
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Does not track COMPOSER_VERSION -- that is a plain ARG, like the ci-tools
  # pins, which pin-bump.yml moves.
  - package-ecosystem: docker
    directory: /ci-php84
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Base lives on mcr.microsoft.com; Dependabot handles non-Hub registries.
  # mcr.microsoft.com/dotnet/sdk:9.0-bookworm-slim: 10.0 would be a major.
  # Same for 8.0 and 10.0.
  - package-ecosystem: docker
    directory: /ci-dotnet9
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /ci-node24
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /ci-python312
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /ci-java17
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
