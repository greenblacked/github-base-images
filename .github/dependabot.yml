version: 2

# Every entry is checked daily (docs/adr/0008-self-updating.md) and sets the
# same `cooldown`: do not adopt a version the day it is published. If an
# upstream release is ever compromised, the window between publication and
# discovery is exactly when a same-day bump would pull it in. Daily checking
# does not shorten that: a version still waits seven days, it is just picked
# up on the day it clears them rather than up to a week later.
#
# `default-days` is the only cooldown key valid here -- the `semver-*-days`
# variants are rejected for both the docker and github-actions ecosystems,
# since neither resolves versions as semver (docker reads a tag, actions read
# a ref).
#
# This delays security fixes by the same amount, which is the real trade-off.
# It is acceptable here because the daily rebuild plus the Trivy gate already
# catch a vulnerable Debian package without waiting for a base-image bump.
#
# Every update -- majors included -- merges itself once all four required
# checks are green on its head commit, via .github/workflows/merge-bot-prs.yml.
# A `hold` label stops one. Majors are labelled needs-review as information
# (.github/workflows/dependabot-auto-merge.yml).
#
# Docker entries: in practice these propose nothing, and that is expected.
# Base images do NOT reach the images through Dependabot. Each `ARG
# BASE_IMAGE` default is a floating tag (python:3.13-slim-bookworm,
# node:22-bookworm-slim, golang:1-bookworm, debian:bookworm-slim), and the
# daily rebuild re-resolves it through the mirror (build-and-push.yml's
# `mirror` job), which is how upstream's patch releases arrive. Dependabot
# compares a tag only with tags of the same shape: for 3.13-slim-bookworm
# that is 3.14-, 3.15-slim-bookworm; for 22-bookworm-slim, 24- and 25-; for
# 1-bookworm, 2-bookworm; for a bare codename, nothing at all. Every one of
# those is a different runtime line -- a different image under the same name
# and tag (`ci-python313:bookworm-v1` is Python 3.13 on Bookworm, and
# consumers chose it for that) -- and is a semver-minor or semver-major
# update, which every entry ignores. The ignore rules are the safety net
# that keeps it so if a tag ever changes shape; the entries stay so that
# would be noticed. `dependency-name: "*"` because each directory has
# exactly one FROM, and Dependabot names registry images
# (mcr.microsoft.com/dotnet/sdk) in a way not worth depending on here.
# A new runtime line is a new image directory, never a bump: the daily image
# lifecycle workflow adds one (docs/adr/0009-image-lifecycle.md).

updates:
  # Keeps the action pins in .github/workflows current (docker/*, actions/*,
  # aquasecurity/trivy-action, astral-sh/setup-uv, scorecard, and
  # dependabot/fetch-metadata in dependabot-auto-merge.yml). hadolint and
  # actionlint are no longer actions here: scripts/lint.sh pins both, and
  # scripts/check-pins.sh and bump-pins.sh keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # github/codeql-action is ONE action with three subpaths -- init, analyze
    # and upload-sarif -- pinned to one SHA in six places. Dependabot treats
    # each subpath as its own dependency, so without this it opens three PRs
    # per release, each moving only its own lines.
    #
    # That is not merely noisy, it is broken: CodeQL rejects a setup where init
    # and analyze are on different versions, so two of the three fail CI with
    # "CodeQL job status was configuration error" and the third passes while
    # being a third of a change. It has happened twice here (#32/#33/#34, and
    # the round before it), costing six PRs that all had to be closed and
    # replaced by a hand-assembled one (#36, #37).
    #
    # Grouping makes Dependabot open a single PR moving all six pins together,
    # which is the only arrangement that works.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Docker: one entry per image, every one the same (scripts/image-lifecycle.sh
  # adds and removes them with the image, and `check` there -- run by
  # scripts/lint.sh -- fails if an image has no entry, an entry has no image,
  # or an entry differs from the others). No per-image comments, so adding or
  # retiring an image never strands one.
  #
  # Dependabot reads the default of the `ARG BASE_IMAGE` each Dockerfile builds
  # FROM (the real upstream ref, not the mirror). As the header says, on these
  # tags it finds nothing it is allowed to propose; the entries are the safety
  # net, and base images move with the daily rebuild. What each shape could
  # propose, all ignored:
  #   - python:3.13-slim-bookworm, ruby:3.4-slim-bookworm, php:8.4-cli-bookworm:
  #     another runtime line (3.14, 4.0, 8.5), a semver-minor or -major;
  #   - node:22-bookworm-slim: another Node major (24, 25);
  #   - eclipse-temurin:21-jdk-noble, mcr.microsoft.com/dotnet/sdk:9.0-bookworm-slim:
  #     another major (25; 10.0). The .NET bases live on mcr.microsoft.com,
  #     which Dependabot reads like Docker Hub;
  #   - golang:1-bookworm, rust:1-bookworm: `1` IS the line -- these two track
  #     current stable on purpose (docs/images.md, "Go and Rust") -- and the
  #     only same-shape tag is 2-bookworm, a major;
  #   - debian:bookworm-slim (the tool images): only a codename, which
  #     Dependabot does not read as a version, so it proposes nothing, trixie
  #     included. The ignore is there so that stays true if it ever starts to.
  #
  # Nor does this track the pinned tool versions (Terraform, kubectl, the AWS
  # CLI, the Docker client, gcloud, Composer, npm, Playwright, ...): those are
  # plain ARGs with no ecosystem behind them, and .github/workflows/pin-bump.yml
  # moves them instead.
  - package-ecosystem: docker
    directory: /ci-cloud
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /ci-db
